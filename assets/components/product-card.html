<!-- =================================
     HZ.SHOP — Product Card Component
     ================================= -->

<article
  class="product"
  data-product-id=""
  onclick="openProduct()"
>

  <div class="product-image">

    <div
      class="product-badge"
      data-product-badge
      hidden
    ></div>

    <button
      type="button"
      class="heart"
      data-favorite-btn
      onclick="event.stopPropagation();toggleFav()"
      aria-label="المفضلة"
    >
      ♡
    </button>

    <div
      class="product-gallery"
      data-product-gallery
    ></div>

  </div>

  <div class="product-info">

    <div
      class="product-category"
      data-product-category
    ></div>

    <div
      class="product-name"
      data-product-name
    ></div>

    <div
      class="product-desc"
      data-product-description
    ></div>

    <div class="price">

      <strong data-product-price></strong>

      <del
        data-product-old-price
        hidden
      ></del>

    </div>

    <div
      class="stock"
      data-product-stock
    ></div>

    <button
      type="button"
      class="add"
      data-add-to-cart
      onclick="event.stopPropagation();add()"
    >
      🛒 أضف إلى السلة
    </button>

    <button
      type="button"
      class="out-of-stock"
      data-out-of-stock
      disabled
      onclick="event.stopPropagation()"
      hidden
    >
      غير متوفر
    </button>

  </div>

</article>
