<!-- =================================
     HZ.SHOP — Product Card Component
     ================================= -->

<article class="product-card" data-product-id="">

  <button
    type="button"
    class="favorite-btn"
    data-favorite-btn
    aria-label="إضافة إلى المفضلة"
  >
    ♡
  </button>

  <div
    class="product-card-image"
    data-product-image
  >
    <img
      src=""
      alt=""
      loading="lazy"
      data-product-image-element
    >

    <span
      class="product-badge"
      data-product-badge
      hidden
    ></span>
  </div>

  <div class="product-card-content">

    <h3
      class="product-name"
      data-product-name
    ></h3>

    <p
      class="product-category"
      data-product-category
    ></p>

    <div class="product-card-bottom">

      <div class="product-price">
        <span data-product-price></span>
        <span class="currency">$</span>
      </div>

      <button
        type="button"
        class="add-to-cart-btn"
        data-add-to-cart
      >
        أضف للسلة
      </button>

    </div>

    <div
      class="product-stock"
      data-product-stock
      hidden
    ></div>

  </div>

</article>
