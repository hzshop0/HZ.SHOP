<!-- =================================
     HZ.SHOP — Cart Button Component
     ================================= -->

<button
  type="button"
  class="cart-button"
  id="componentCartButton"
  aria-label="السلة"
  title="السلة"
  onclick="openCart()"
>
  <span
    class="cart-icon"
    aria-hidden="true"
  >🛒</span>

  <span class="cart-label">
    السلة
  </span>

  <span
    class="badge"
    data-cart-count
    hidden
  >0</span>
</button>
