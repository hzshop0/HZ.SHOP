<!-- =================================
     HZ.SHOP — Header Component
     ================================= -->

<header>

  <div class="header">

    <!-- Logo -->
    <a
      class="logo"
      href="/"
      onclick="goHome(event)"
      aria-label="HZ.SHOP الرئيسية"
    >
      <strong>HZ.SHOP</strong>
      <small>LUXURY BEAUTY STORE</small>
    </a>

    <!-- Desktop Search -->
    <div class="search">

      <span class="search-icon">
        ⌕
      </span>

      <input
        id="search"
        type="search"
        placeholder="ابحث عن منتج..."
        oninput="searchProducts()"
      >

      <button
        class="search-clear"
        id="searchClear"
        onclick="clearSearch()"
      >
        ×
      </button>

    </div>

    <!-- Actions -->
    <div class="actions">

      <button
        class="icon-btn"
        onclick="openFavorites()"
        aria-label="المفضلة"
      >
        ♡

        <span
          class="badge"
          id="favCount"
        >0</span>

      </button>

      <button
        class="icon-btn"
        onclick="openCart()"
        aria-label="السلة"
      >
        🛒

        <span
          class="badge"
          id="cartCount"
        >0</span>

      </button>

      <button
        class="icon-btn"
        onclick="window.location.href='/Account.html'"
        aria-label="حساب العميل"
      >
        👤
      </button>

    </div>

  </div>

  <!-- Mobile Search -->
  <div class="mobile-search">

    <div class="mobile-search-box">

      <span>
        ⌕
      </span>

      <input
        id="mobileSearch"
        type="search"
        placeholder="ابحث عن منتج..."
        oninput="mobileSearchProducts()"
      >

      <button
        onclick="clearMobileSearch()"
      >
        ×
      </button>

    </div>

  </div>

  <!-- Navigation -->
  <nav>

    <div class="nav">

      <button
        class="active"
        onclick="category('all',this)"
      >
        الرئيسية
      </button>

      <button
        onclick="category('perfumes',this)"
      >
        العطور
      </button>

      <button
        onclick="category('makeup',this)"
      >
        مكياج
      </button>

      <button
        onclick="category('skin',this)"
      >
        العناية بالبشرة
      </button>

      <button
        onclick="category('personal',this)"
      >
        العناية الشخصية
      </button>

      <button
        onclick="category('accessories',this)"
      >
        إكسسوارات
      </button>

      <button
        onclick="category('clothing',this)"
      >
        ملابس
      </button>

      <button
        onclick="category('lingerie',this)"
      >
        لانجري
      </button>

      <button
        onclick="category('home',this)"
      >
        منزل
      </button>

      <button
        onclick="category('electronics',this)"
      >
        إلكترونيات
      </button>

      <button
        onclick="category('kids',this)"
      >
        ألعاب أطفال
      </button>

      <button
        onclick="category('cleaning',this)"
      >
        النظافة
      </button>

      <button
        onclick="goShop()"
      >
        جميع المنتجات
      </button>

    </div>

  </nav>

</header>
