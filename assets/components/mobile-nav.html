<!-- =================================
     HZ.SHOP — Mobile Navigation
     ================================= -->

<nav
  class="bottom-nav"
  aria-label="تنقل المتجر على الهاتف"
>

  <button
    type="button"
    class="active"
    id="bottomHome"
    onclick="goHome()"
  >
    <span class="bn-icon">⌂</span>
    <span>الرئيسية</span>
  </button>

  <button
    type="button"
    id="bottomCategories"
    onclick="openCategoriesNav()"
  >
    <span class="bn-icon">☰</span>
    <span>التصنيفات</span>
  </button>

  <button
    type="button"
    id="bottomFavorites"
    onclick="openFavorites()"
  >
    <span class="bn-icon">♡</span>
    <span>المفضلة</span>
    <span class="bn-badge" id="bottomFavCount">0</span>
  </button>

  <button
    type="button"
    id="bottomCart"
    onclick="openCart()"
  >
    <span class="bn-icon">🛒</span>
    <span>السلة</span>
    <span class="bn-badge" id="bottomCartCount">0</span>
  </button>

  <button
    type="button"
    id="bottomAccount"
    onclick="window.location.href='/Account.html'"
  >
    <span class="bn-icon">♙</span>
    <span>الحساب</span>
  </button>

</nav>
