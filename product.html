<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>HZ.SHOP | المنتج</title>

<meta
  id="metaDescription"
  name="description"
  content="HZ.SHOP — اكتشف تفاصيل المنتج وتسوق بسهولة."
>

<meta
  name="theme-color"
  content="#ffffff"
>

<style>

/* =========================================================
   HZ.SHOP — PRODUCT PAGE
   MATCHED WITH CURRENT HOMEPAGE DESIGN
========================================================= */

:root{

  --black:#111111;
  --black-2:#1b1b1b;

  --white:#ffffff;

  --soft:#f7f7f7;

  --line:#e7e7e7;

  --muted:#707070;

  --orange:#ff6a00;
  --orange2:#ff7a1a;

  --orange-soft:#fff1e8;

  --danger:#d93025;

  --success:#238b45;

}


*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html{
  scroll-behavior:smooth;
}


body{

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  background:var(--white);

  color:#151515;

  overflow-x:hidden;

  -webkit-text-size-adjust:100%;

  padding-bottom:0;

}


button,
input{
  font-family:inherit;
}


button{
  cursor:pointer;
}


button:disabled{
  cursor:not-allowed;
}


/* =========================================================
   TOP BAR — SAME AS HOMEPAGE
========================================================= */

.topbar{

  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f7f7f7;

  color:#555;

  font-size:11px;

  padding:0 10px;

  white-space:nowrap;

  overflow:hidden;

  border-bottom:1px solid #e9e9e9;

}


/* =========================================================
   HEADER — SAME AS HOMEPAGE
========================================================= */

header{

  position:sticky;

  top:0;

  z-index:1000;

  background:#ffffff;

  color:#111111;

  border-bottom:1px solid #e5e5e5;

  box-shadow:
    0 2px 14px rgba(0,0,0,.06);

}


.header{

  height:72px;

  max-width:1400px;

  margin:auto;

  padding:0 20px;

  display:flex;

  align-items:center;

  gap:18px;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

  display:block;

  text-align:center;

  min-width:145px;

  cursor:pointer;

  flex-shrink:0;

  text-decoration:none;

}


.logo strong{

  display:block;

  font-size:25px;

  letter-spacing:4px;

  color:#111;

  line-height:1;

}


.logo strong span{
  color:var(--orange);
}


.logo small{

  font-size:7px;

  letter-spacing:3px;

  color:#888;

  display:block;

  margin-top:5px;

}


/* =========================================================
   SEARCH — SAME AS HOMEPAGE
========================================================= */

.search{

  flex:1;

  max-width:680px;

  position:relative;

  margin:auto;

}


.search input{

  width:100%;

  height:44px;

  background:#fff;

  border:1px solid #d9d9d9;

  color:#111;

  padding:
    0 44px
    0 42px;

  outline:none;

  border-radius:6px;

  font-size:13px;

  transition:.2s;

}


.search input:focus{

  border-color:var(--orange);

  box-shadow:
    0 0 0 2px
    rgba(255,106,0,.10);

}


.search-icon{

  position:absolute;

  right:14px;

  top:10px;

  color:#111;

  font-size:21px;

  z-index:2;

  line-height:1;

  pointer-events:none;

}


.search-clear{

  position:absolute;

  left:7px;

  top:6px;

  width:32px;

  height:32px;

  border:0;

  background:none;

  color:#777;

  display:none;

  font-size:20px;

}


/* =========================================================
   HEADER FAVORITE
========================================================= */

.header-favorite{

  position:relative;

  width:46px;

  height:46px;

  flex-shrink:0;

  border:1px solid #ddd;

  border-radius:6px;

  background:#fff;

  color:#111;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  transition:.2s;

}


.header-favorite:hover{

  border-color:var(--orange);

  color:var(--orange);

}


.header-favorite:active{
  transform:scale(.96);
}


.badge{

  position:absolute;

  top:-5px;

  right:-5px;

  min-width:18px;

  height:18px;

  padding:0 4px;

  border-radius:10px;

  background:var(--orange);

  color:#fff;

  font-size:9px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:1px solid #fff;

  font-weight:bold;

}


/* =========================================================
   PAGE
========================================================= */

.page{

  max-width:1400px;

  margin:auto;

  padding:
    20px
    20px
    90px;

}


/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb{

  display:flex;

  align-items:center;

  gap:8px;

  font-size:11px;

  color:#888;

  margin-bottom:18px;

  flex-wrap:wrap;

}


.breadcrumb button{

  border:0;

  background:none;

  color:var(--orange);

  font-size:11px;

  font-weight:700;

}


.breadcrumb button:hover{
  text-decoration:underline;
}


.breadcrumb strong{
  color:#333;
}


/* =========================================================
   PRODUCT LAYOUT
========================================================= */

.product-layout{

  display:grid;

  grid-template-columns:
    minmax(0,1.08fr)
    minmax(350px,.92fr);

  gap:42px;

  align-items:start;

}


/* =========================================================
   GALLERY
========================================================= */

.gallery-section{

  min-width:0;

  position:relative;

}


.main-image{

  position:relative;

  width:100%;

  height:650px;

  background:#f7f7f7;

  border:1px solid #eee;

  border-radius:8px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


.main-image img{

  width:100%;

  height:100%;

  object-fit:contain;

  display:block;

  padding:18px;

  transition:transform .3s ease;

}


.main-image:hover img{
  transform:scale(1.015);
}


/* =========================================================
   VIDEO
========================================================= */

.main-image video{

  width:100%;

  height:100%;

  object-fit:contain;

  display:block;

  background:#000;

}


.main-image video:hover{
  transform:none;
}


.fallback{

  display:none;

  align-items:center;

  justify-content:center;

  width:100%;

  height:100%;

  padding:30px;

  text-align:center;

  font-size:28px;

  color:var(--orange);

  font-weight:bold;

}


/* =========================================================
   GALLERY ARROWS
========================================================= */

.gallery-arrow{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:42px;

  height:42px;

  border:1px solid #ddd;

  border-radius:50%;

  background:rgba(255,255,255,.96);

  color:#111;

  font-size:25px;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:3;

  transition:.2s;

}


.gallery-arrow:hover{

  border-color:var(--orange);

  color:var(--orange);

  transform:
    translateY(-50%)
    scale(1.04);

}


.gallery-arrow.prev{
  right:14px;
}


.gallery-arrow.next{
  left:14px;
}


/* =========================================================
   THUMBNAILS
========================================================= */

.thumbs{

  display:flex;

  gap:9px;

  overflow-x:auto;

  padding:
    11px
    1px
    3px;

  scrollbar-width:none;

}


.thumbs::-webkit-scrollbar{
  display:none;
}


.thumb{

  flex:0 0 76px;

  height:76px;

  border:1px solid #ddd;

  background:#fff;

  border-radius:6px;

  padding:3px;

  overflow:hidden;

  transition:.2s;

}


.thumb:hover{
  border-color:#bbb;
}


.thumb.active{

  border:
    2px solid
    var(--orange);

}


.thumb img{

  width:100%;

  height:100%;

  object-fit:cover;

  border-radius:4px;

  display:block;

}


.thumb video{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  border-radius:4px;

  background:#000;

  pointer-events:none;

}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{

  padding:4px 0;

}


.category{

  display:inline-flex;

  align-items:center;

  min-height:27px;

  padding:
    4px
    11px;

  border-radius:20px;

  background:var(--orange-soft);

  color:#e85f00;

  font-size:11px;

  font-weight:700;

  margin-bottom:10px;

}


.product-name{

  font-size:36px;

  line-height:1.3;

  font-weight:750;

  color:#111;

  margin-bottom:14px;

  letter-spacing:-.3px;

}


.description{

  font-size:14px;

  color:var(--muted);

  line-height:2;

  margin-bottom:22px;

  white-space:pre-line;

}


/* =========================================================
   PRICE
========================================================= */

.price-box{

  display:flex;

  align-items:center;

  gap:12px;

  padding:
    16px
    0;

  border-top:
    1px solid
    var(--line);

  border-bottom:
    1px solid
    var(--line);

  margin-bottom:18px;

}


.price{

  font-size:31px;

  font-weight:800;

  color:#111;

}


.old-price{

  font-size:15px;

  color:#999;

}


.discount{

  padding:
    4px
    8px;

  border-radius:4px;

  background:var(--orange);

  color:#fff;

  font-size:10px;

  font-weight:800;

}


/* =========================================================
   STOCK
========================================================= */

.stock{

  display:inline-flex;

  align-items:center;

  gap:7px;

  font-size:12px;

  color:var(--success);

  background:#eff9f2;

  border:1px solid #d7eedf;

  border-radius:5px;

  padding:
    7px
    11px;

  margin-bottom:18px;

}


.stock.out{

  color:var(--danger);

  background:#fff1f1;

  border-color:#efd7d7;

}


/* =========================================================
   QUANTITY
========================================================= */

.quantity-row{

  display:flex;

  align-items:center;

  gap:12px;

  margin-bottom:12px;

}


.quantity-label{

  font-size:12px;

  color:var(--muted);

  font-weight:700;

}


.quantity{

  display:flex;

  height:46px;

  border:1px solid #ddd;

  background:#fff;

  border-radius:6px;

  overflow:hidden;

}


.quantity button{

  width:43px;

  border:0;

  background:#f5f5f5;

  color:#111;

  font-size:20px;

  transition:.15s;

}


.quantity button:hover{

  background:var(--orange-soft);

  color:var(--orange);

}


.quantity input{

  width:55px;

  border:0;

  border-left:1px solid #e5e5e5;

  border-right:1px solid #e5e5e5;

  text-align:center;

  outline:0;

  font-weight:700;

  color:#111;

  background:#fff;

}


/* =========================================================
   ADD TO CART
========================================================= */

.add-btn{

  width:100%;

  min-height:55px;

  border:0;

  border-radius:6px;

  background:#111;

  color:#fff;

  font-weight:800;

  font-size:15px;

  transition:.2s;

}


.add-btn:hover{

  background:#242424;

  transform:translateY(-1px);

}


.add-btn:active{
  transform:translateY(0);
}


.add-btn:disabled{

  background:#aaa;

  transform:none;

}


/* =========================================================
   FAVORITE
========================================================= */

.favorite-btn{

  width:100%;

  min-height:49px;

  margin-top:9px;

  border:1px solid #ddd;

  border-radius:6px;

  background:#fff;

  color:#333;

  font-size:13px;

  font-weight:700;

  transition:.2s;

}


.favorite-btn:hover,
.favorite-btn.active{

  border-color:var(--orange);

  color:var(--orange);

  background:var(--orange-soft);

}


/* =========================================================
   INFO BOXES
========================================================= */

.buy-info{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:13px;

}


.info-box{

  border:1px solid #e7e7e7;

  background:#fff;

  border-radius:6px;

  padding:
    12px
    8px;

  text-align:center;

  font-size:11px;

  color:#666;

  transition:.2s;

}


.info-box:hover{

  border-color:#ccc;

  transform:translateY(-1px);

}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading,
.error{

  min-height:450px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#777;

  font-size:14px;

  padding:30px;

  background:#fff;

  border:1px solid #e7e7e7;

  border-radius:8px;

}


.error{

  flex-direction:column;

  gap:15px;

}


.back-btn{

  border:0;

  background:#111;

  color:#fff;

  padding:
    11px
    22px;

  border-radius:5px;

  font-weight:700;

}


.back-btn:hover{
  background:var(--orange);
}


/* =========================================================
   TOAST
========================================================= */

.toast{

  position:fixed;

  bottom:25px;

  right:20px;

  z-index:5000;

  max-width:
    calc(100vw - 40px);

  background:#111;

  border:
    1px solid
    rgba(255,106,0,.65);

  padding:
    12px
    17px;

  border-radius:6px;

  color:#fff;

  transform:
    translateY(120px);

  opacity:0;

  transition:.3s;

  font-size:12px;

}


.toast.show{

  transform:
    translateY(0);

  opacity:1;

}


/* =========================================================
   MOBILE BOTTOM NAV
   MATCHED WITH HOMEPAGE
========================================================= */

.bottom-nav{
  display:none;
}


@media(min-width:901px){

  .product-info{

    position:sticky;

    top:94px;

  }

}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:900px){

  body{
    padding-bottom:68px;
  }


  .header{

    height:66px;

    padding:
      0
      15px;

    gap:8px;

  }


  .logo{
    min-width:105px;
  }


  .logo strong{
    font-size:20px;
  }


  .search{
    max-width:none;
  }


  .header-favorite{

    width:40px;
    height:40px;

  }


  .header-favorite{
    font-size:21px;
  }


  .product-layout{

    grid-template-columns:1fr;

    gap:25px;

  }


  .main-image{
    height:520px;
  }


  .product-name{
    font-size:31px;
  }


  .page{

    padding:
      16px
      15px
      80px;

  }


  .bottom-nav{

    position:fixed;

    display:grid;

    grid-template-columns:
      repeat(5,1fr);

    left:0;
    right:0;
    bottom:0;

    height:68px;

    z-index:4000;

    background:#fff;

    border-top:
      1px solid
      #e5e5e5;

    box-shadow:
      0 -5px 18px
      rgba(0,0,0,.08);

    padding:
      4px
      3px
      env(safe-area-inset-bottom);

  }


  .bottom-nav button{

    position:relative;

    border:0;

    background:none;

    color:#777;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:10px;

  }


  .bottom-nav button .bn-icon{

    width:25px;

    height:25px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

    line-height:1;

  }


  .bottom-nav button.active{

    color:var(--orange);

  }


  .bottom-nav button:active{
    transform:scale(.94);
  }


  .nav-count{

    position:absolute;

    top:2px;

    right:
      calc(50% - 22px);

    min-width:16px;

    height:16px;

    border-radius:9px;

    background:var(--orange);

    color:#fff;

    font-size:8px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid #fff;

    font-weight:bold;

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

  .topbar{

    height:27px;

    font-size:10px;

  }


  .header{

    padding:
      0
      9px;

  }


  .logo{

    min-width:88px;

  }


  .logo strong{

    font-size:18px;

    letter-spacing:2px;

  }


  .logo small{

    font-size:6px;

    letter-spacing:1.7px;

  }


  .search input{

    height:40px;

    font-size:12px;

    padding:
      0
      38px
      0
      38px;

  }


  .search-icon{

    top:8px;

    right:11px;

  }


  .header-favorite{

    width:38px;

    height:38px;

    font-size:20px;

  }


  .page{

    padding:
      13px
      10px
      78px;

  }


  .breadcrumb{

    font-size:10px;

    margin-bottom:13px;

  }


  .main-image{

    height:390px;

    border-radius:7px;

  }


  .main-image img{
    padding:10px;
  }


  .gallery-arrow{

    width:37px;

    height:37px;

    font-size:22px;

  }


  .gallery-arrow.prev{
    right:8px;
  }


  .gallery-arrow.next{
    left:8px;
  }


  .thumb{

    flex-basis:63px;

    height:63px;

  }


  .product-name{

    font-size:27px;

  }


  .description{

    font-size:13px;

    line-height:1.9;

  }


  .price{
    font-size:28px;
  }


  .add-btn{

    min-height:53px;

    font-size:14px;

  }


  .toast{

    left:10px;

    right:10px;

    bottom:78px;

    max-width:none;

    text-align:center;

  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

  .search{
    display:none;
  }


  .header{
    justify-content:space-between;
  }


  .main-image{
    height:350px;
  }


  .product-name{
    font-size:24px;
  }


  .buy-info{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<!-- =======================================================
     TOP BAR
======================================================= -->

<div class="topbar">

  ✦ HZ.SHOP — تسوق بسهولة واستمتع بتجربة مميزة ✦

</div>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

  <div class="header">


    <a
      class="logo"
      href="/"
      aria-label="HZ.SHOP الرئيسية"
    >

      <strong>
        HZ.<span>SHOP</span>
      </strong>

      <small>
        LUXURY BEAUTY STORE
      </small>

    </a>


    <div class="search">

      <span class="search-icon">
        ⌕
      </span>


      <input
        id="headerSearch"
        type="search"
        placeholder="ابحث عن منتج..."
        autocomplete="off"
      >


      <button
        class="search-clear"
        id="searchClear"
        type="button"
        aria-label="مسح البحث"
      >
        ×
      </button>

    </div>


    <button
      class="header-favorite"
      onclick="openFavorites()"
      type="button"
      aria-label="المفضلة"
      title="المفضلة"
    >

      ♡

      <span
        class="badge"
        id="favCount"
      >
        0
      </span>

    </button>


  </div>

</header>


<!-- =======================================================
     PAGE
======================================================= -->

<main class="page">


  <div class="breadcrumb">


    <button
      onclick="goHome()"
      type="button"
    >
      الرئيسية
    </button>


    <span>›</span>


    <span id="breadcrumbCategory">
      المنتج
    </span>


    <span>›</span>


    <strong id="breadcrumbName">
      جاري التحميل...
    </strong>


  </div>


  <div id="productContainer">

    <div class="loading">
      جاري تحميل المنتج...
    </div>

  </div>


</main>


<!-- =======================================================
     TOAST
======================================================= -->

<div
  class="toast"
  id="toast"
></div>


<!-- =======================================================
     MOBILE BOTTOM NAV
======================================================= -->

<nav
  class="bottom-nav"
  aria-label="التنقل الرئيسي"
>


  <button
    id="bottomHome"
    class="active"
    onclick="goHome()"
    type="button"
  >

    <span class="bn-icon">
      ⌂
    </span>

    <span>
      الرئيسية
    </span>

  </button>


  <button
    id="bottomCategories"
    onclick="openCategories()"
    type="button"
  >

    <span class="bn-icon">
      ☰
    </span>

    <span>
      التصنيفات
    </span>

  </button>


  <button
    id="bottomFavorites"
    onclick="openFavorites()"
    type="button"
  >

    <span class="bn-icon">
      ♡
    </span>

    <span>
      المفضلة
    </span>

    <span
      class="nav-count"
      id="mobileFavCount"
    >
      0
    </span>

  </button>


  <button
    id="bottomCart"
    onclick="openCart()"
    type="button"
  >

    <span class="bn-icon">
      🛒
    </span>

    <span>
      السلة
    </span>

    <span
      class="nav-count"
      id="mobileCartCount"
    >
      0
    </span>

  </button>


  <button
    id="bottomAccount"
    onclick="openAccount()"
    type="button"
  >

    <span class="bn-icon">
      ♙
    </span>

    <span>
      الحساب
    </span>

  </button>


</nav>


<script>

/* =========================================================
   HZ.SHOP PRODUCT LOGIC
========================================================= */

let product = null;

let images = [];

let media = [];

let currentImage = 0;


/* =========================================================
   CART
========================================================= */

function loadCart(){

  try{

    const parsed =
      JSON.parse(
        localStorage.getItem("hz_cart") || "[]"
      );


    return Array.isArray(parsed)
      ? parsed
      : [];


  }catch(error){

    console.warn(
      "تعذر قراءة سلة HZ.SHOP:",
      error
    );


    return [];

  }

}


let cart = loadCart();


/* =========================================================
   FAVORITES
========================================================= */

function loadFavorites(){

  try{

    const parsed =
      JSON.parse(
        localStorage.getItem("hz_fav") || "[]"
      );


    return Array.isArray(parsed)
      ? parsed
      : [];


  }catch(error){

    console.warn(
      "تعذر قراءة مفضلة HZ.SHOP:",
      error
    );


    return [];

  }

}


let favorites = loadFavorites();


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================================================
   NORMALIZE IMAGES
========================================================= */

function normalizeImages(product){

  let raw =
    product &&
    product.images !== undefined &&
    product.images !== null

      ? product.images

      : product?.image || [];


  if(typeof raw === "string"){

    const value =
      raw.trim();


    if(!value){
      return [];
    }


    if(
      value.startsWith("[") &&
      value.endsWith("]")
    ){

      try{

        const parsed =
          JSON.parse(value);


        if(Array.isArray(parsed)){

          raw = parsed;

        }else{

          raw = [value];

        }

      }catch(error){

        raw = [value];

      }

    }

    else if(value.includes("\n")){

      raw =
        value
          .split(/\r?\n/)
          .map(
            x=>x.trim()
          )
          .filter(Boolean);

    }

    else if(value.includes(",")){

      raw =
        value
          .split(",")
          .map(
            x=>x.trim()
          )
          .filter(Boolean);

    }

    else{

      raw = [value];

    }

  }


  if(!Array.isArray(raw)){
    raw = [raw];
  }


  return raw

    .map(image=>{

      if(typeof image === "string"){

        return image.trim();

      }


      if(
        image &&
        typeof image === "object"
      ){

        return String(

          image.url ||
          image.image ||
          image.src ||
          image.path ||
          ""

        ).trim();

      }


      return "";

    })

    .filter(Boolean);

}


/* =========================================================
   PRODUCT ID
========================================================= */

function getProductId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    Number(
      params.get("id")
    );


  return Number.isFinite(id) &&
    id > 0

    ? id

    : null;

}


/* =========================================================
   STOCK
========================================================= */

function getStock(){

  if(
    !product ||
    product.stock === undefined ||
    product.stock === null ||
    product.stock === ""
  ){

    return null;

  }


  const value =
    Number(product.stock);


  if(!Number.isFinite(value)){

    return null;

  }


  return Math.max(
    0,
    Math.floor(value)
  );

}


function getMaxQuantity(){

  const stock =
    getStock();


  return stock === null
    ? 99
    : stock;

}


function isAvailable(){

  const stock =
    getStock();


  return stock === null ||
    stock > 0;

}


/* =========================================================
   CATEGORY
========================================================= */

function categoryName(value){

  const names = {

    perfumes:"العطور",

    perfume:"العطور",

    makeup:"مكياج",

    skin:"العناية بالبشرة",

    personal:"العناية الشخصية",

    accessories:"إكسسوارات",

    clothing:"ملابس",

    lingerie:"لانجري",

    home:"منزل",

    electronics:"إلكترونيات",

    kids:"ألعاب أطفال",

    cleaning:"النظافة"

  };


  const text =
    String(value || "")
      .trim()
      .toLowerCase();


  return names[text] ||
    String(
      value || "المنتج"
    );

}


/* =========================================================
   MEDIA
========================================================= */

function buildProductMedia(){

  media =
    images.map(
      function(image){

        return {

          type:"image",

          url:String(image)

        };

      }
    );


  const productVideo =
    String(
      product?.video || ""
    ).trim();


  if(productVideo){

    media.push({

      type:"video",

      url:productVideo

    });

  }


  currentImage = 0;

}


/* =========================================================
   LOAD PRODUCT
========================================================= */

async function loadProduct(){

  const id =
    getProductId();


  if(!id){

    showError(
      "رابط المنتج غير صحيح."
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/products",
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "تعذر تحميل المنتجات"
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "بيانات المنتجات غير صحيحة"
      );

    }


    const found =
      data.find(
        item =>
          Number(item.id) === id
      );


    if(!found){

      showError(
        "المنتج غير موجود."
      );

      return;

    }


    product = found;


    images =
      normalizeImages(product);


    if(
      !images.length &&
      product.image
    ){

      images = [

        String(
          product.image
        )

      ];

    }


    buildProductMedia();


    const productName =
      String(
        product.name ||
        "HZ.SHOP"
      );


    document.title =
      productName +
      " | HZ.SHOP";


    const meta =
      document.getElementById(
        "metaDescription"
      );


    if(meta){

      meta.setAttribute(

        "content",

        "HZ.SHOP — " +
        productName +
        "، اكتشف تفاصيل المنتج وتسوق بسهولة."

      );

    }


    document
      .getElementById(
        "breadcrumbCategory"
      )
      .textContent =
        categoryName(
          product.category
        );


    document
      .getElementById(
        "breadcrumbName"
      )
      .textContent =
        productName;


    renderProduct();


    updateCartCount();

    updateFavoriteCount();

    updateFavoriteButton();


    trackViewContent();


  }catch(error){

    console.error(error);


    showError(
      "تعذر تحميل المنتج. حاول تحديث الصفحة."
    );

  }

}


/* =========================================================
   META — VIEW CONTENT
========================================================= */

function trackViewContent(){

  if(
    typeof fbq !== "function" ||
    !product
  ){

    return;

  }


  try{

    fbq(

      "track",

      "ViewContent",

      {

        content_ids:[
          String(product.id)
        ],

        content_type:"product",

        content_name:
          String(
            product.name || ""
          ),

        value:
          Number(
            product.price || 0
          ),

        currency:"USD"

      }

    );

  }catch(error){

    console.warn(
      "Meta ViewContent error:",
      error
    );

  }

}


/* =========================================================
   RENDER PRODUCT
========================================================= */

function renderProduct(){

  const container =
    document.getElementById(
      "productContainer"
    );


  const price =
    Number(
      product.price || 0
    );


  const oldRaw =

    product.old !== undefined &&
    product.old !== null &&
    product.old !== ""

      ? product.old

      : product.old_price;


  const old =

    oldRaw !== undefined &&
    oldRaw !== null &&
    oldRaw !== ""

      ? Number(oldRaw)

      : null;


  const available =
    isAvailable();


  const maxQuantity =
    getMaxQuantity();


  const hasMultiple =
    media.length > 1;


  const mainMedia =
    media[0] || null;


  let discountHtml = "";


  if(

    old !== null &&

    Number.isFinite(old) &&

    old > price &&

    old > 0

  ){

    const percentage =
      Math.round(
        ((old - price) / old) * 100
      );


    discountHtml = `

      <span class="discount">
        -${percentage}%
      </span>

    `;

  }


  let thumbs = "";


  if(hasMultiple){

    thumbs =
      media
        .map(
          (item,index)=>{

            if(
              item.type === "video"
            ){

              return `

                <button
                  class="thumb ${index===0 ? "active" : ""}"
                  onclick="changeImage(${index})"
                  type="button"
                  aria-label="الفيديو"
                >

                  <video
                    src="${escapeHtml(item.url)}"
                    muted
                    playsinline
                    preload="metadata"
                  ></video>

                </button>

              `;

            }


            return `

              <button
                class="thumb ${index===0 ? "active" : ""}"
                onclick="changeImage(${index})"
                type="button"
                aria-label="الصورة ${index+1}"
              >

                <img
                  src="${escapeHtml(item.url)}"
                  alt="${escapeHtml(product.name)} - ${index+1}"
                  loading="${index===0 ? "eager" : "lazy"}"
                  onerror="this.style.opacity='.35'"
                >

              </button>

            `;

          }
        )
        .join("");

  }


  const gallery = `

    <div class="gallery-section">

      <div class="main-image">

        ${
          mainMedia

          ?

          `

            <img
              id="mainProductImage"
              src="${
                mainMedia.type === "image"
                  ? escapeHtml(mainMedia.url)
                  : ""
              }"
              alt="${escapeHtml(product.name)}"
              style="
                display:
                ${
                  mainMedia.type === "image"
                    ? "block"
                    : "none"
                }
              "
              onerror="imageError(this)"
            >


            <video
              id="mainProductVideo"
              src="${
                mainMedia.type === "video"
                  ? escapeHtml(mainMedia.url)
                  : ""
              }"
              controls
              playsinline
              preload="metadata"
              style="
                display:
                ${
                  mainMedia.type === "video"
                    ? "block"
                    : "none"
                }
              "
            ></video>


            <div
              class="fallback"
              id="fallback"
            >
              ${escapeHtml(product.name)}
            </div>

          `

          :

          `

            <div
              class="fallback"
              style="display:flex"
            >
              ${escapeHtml(product.name)}
            </div>

          `
        }


        ${
          hasMultiple

          ?

          `

            <button
              class="gallery-arrow prev"
              onclick="changeImage(currentImage-1)"
              type="button"
              aria-label="الصورة السابقة"
            >
              ›
            </button>


            <button
              class="gallery-arrow next"
              onclick="changeImage(currentImage+1)"
              type="button"
              aria-label="الصورة التالية"
            >
              ‹
            </button>

          `

          :

          ""

        }

      </div>


      ${
        hasMultiple

        ?

        `

          <div class="thumbs">
            ${thumbs}
          </div>

        `

        :

        ""

      }

    </div>

  `;


  container.innerHTML = `

    <div class="product-layout">

      ${gallery}


      <div class="product-info">


        <div class="category">

          ${escapeHtml(
            categoryName(
              product.category
            )
          )}

        </div>


        <h1 class="product-name">

          ${escapeHtml(
            product.name
          )}

        </h1>


        <div class="description">

          ${escapeHtml(
            product.description ||
            "اكتشف تفاصيل هذا المنتج من HZ.SHOP."
          )}

        </div>


        <div class="price-box">

          <strong class="price">

            $${price.toFixed(2)}

          </strong>


          ${
            old !== null &&
            Number.isFinite(old) &&
            old > price

            ?

            `

              <del class="old-price">

                $${old.toFixed(2)}

              </del>

              ${discountHtml}

            `

            :

            ""

          }

        </div>


        <div
          class="stock ${available ? "" : "out"}"
        >

          ${
            available

            ?

            "✓ المنتج متوفر"

            :

            "✕ المنتج غير متوفر حاليًا"

          }

        </div>


        <div class="quantity-row">

          <span class="quantity-label">
            الكمية
          </span>


          <div class="quantity">

            <button
              type="button"
              onclick="changeQuantity(-1)"
              ${available ? "" : "disabled"}
            >
              −
            </button>


            <input
              id="quantity"
              type="number"
              value="${available ? 1 : 0}"
              min="${available ? 1 : 0}"
              max="${maxQuantity}"
              inputmode="numeric"
              ${available ? "" : "disabled"}
            >


            <button
              type="button"
              onclick="changeQuantity(1)"
              ${available ? "" : "disabled"}
            >
              +
            </button>

          </div>

        </div>


        <button
          class="add-btn"
          onclick="addToCart()"
          type="button"
          ${available ? "" : "disabled"}
        >

          ${
            available

            ?

            "🛒 أضف إلى السلة"

            :

            "المنتج غير متوفر"

          }

        </button>


        <button
          class="favorite-btn"
          id="favoriteButton"
          onclick="toggleFavorite()"
          type="button"
        >
          ♡ إضافة إلى المفضلة
        </button>


        <div class="buy-info">

          <div class="info-box">
            🚚 توصيل سريع
          </div>

          <div class="info-box">
            💳 الدفع عند الاستلام
          </div>

          <div class="info-box">
            🔒 تسوق آمن
          </div>

          <div class="info-box">
            💬 خدمة العملاء
          </div>

        </div>


      </div>

    </div>

  `;

}


/* =========================================================
   IMAGE ERROR
========================================================= */

function imageError(img){

  img.style.display =
    "none";


  const fallback =
    document.getElementById(
      "fallback"
    );


  if(fallback){

    fallback.style.display =
      "flex";

  }

}


/* =========================================================
   CHANGE MEDIA
========================================================= */

function changeImage(index){

  if(!media.length){
    return;
  }


  if(index < 0){

    index =
      media.length - 1;

  }


  if(index >= media.length){

    index = 0;

  }


  currentImage =
    index;


  const selectedMedia =
    media[index];


  const mainImage =
    document.getElementById(
      "mainProductImage"
    );


  const mainVideo =
    document.getElementById(
      "mainProductVideo"
    );


  const fallback =
    document.getElementById(
      "fallback"
    );


  if(
    selectedMedia &&
    selectedMedia.type === "video"
  ){

    if(mainImage){

      mainImage.style.display =
        "none";

    }


    if(mainVideo){

      mainVideo.pause();

      mainVideo.src =
        selectedMedia.url;

      mainVideo.style.display =
        "block";

      mainVideo.load();

    }

  }

  else if(

    selectedMedia &&
    selectedMedia.type === "image"

  ){

    if(mainVideo){

      mainVideo.pause();

      mainVideo.style.display =
        "none";

    }


    if(mainImage){

      mainImage.src =
        selectedMedia.url;

      mainImage.alt =
        String(
          product?.name ||
          "المنتج"
        ) +
        " - " +
        (index + 1);

      mainImage.style.display =
        "block";

    }

  }


  if(fallback){

    fallback.style.display =
      "none";

  }


  document
    .querySelectorAll(".thumb")
    .forEach(
      (thumb,i)=>{

        thumb.classList.toggle(
          "active",
          i === index
        );

      }
    );


  const active =
    document.querySelector(
      ".thumb.active"
    );


  if(active){

    active.scrollIntoView({

      behavior:"smooth",

      block:"nearest",

      inline:"center"

    });

  }

}


/* =========================================================
   QUANTITY
========================================================= */

function changeQuantity(amount){

  const input =
    document.getElementById(
      "quantity"
    );


  if(
    !input ||
    !isAvailable()
  ){

    return;

  }


  const max =
    getMaxQuantity();


  let value =
    Number(
      input.value || 1
    );


  if(!Number.isFinite(value)){

    value = 1;

  }


  value =
    Math.floor(value);


  value += amount;


  if(value < 1){

    value = 1;

  }


  if(value > max){

    value = max;

  }


  input.value =
    value;

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(){

  if(!product){

    return;

  }


  if(!isAvailable()){

    toast(
      "هذا المنتج غير متوفر حاليًا"
    );

    return;

  }


  const input =
    document.getElementById(
      "quantity"
    );


  let quantity =
    Number(
      input?.value || 1
    );


  if(!Number.isFinite(quantity)){

    quantity = 1;

  }


  quantity =
    Math.max(

      1,

      Math.min(

        getMaxQuantity(),

        Math.floor(quantity)

      )

    );


  const id =
    Number(product.id);


  const item =
    cart.find(
      x =>
        Number(x.id) === id
    );


  const existingQuantity =
    item

      ?

      Math.max(

        0,

        Math.floor(
          Number(
            item.quantity
          ) || 0
        )

      )

      :

      0;


  const max =
    getMaxQuantity();


  if(

    existingQuantity +
    quantity >
    max

  ){

    const remaining =
      Math.max(

        0,

        max -
        existingQuantity

      );


    if(remaining === 0){

      toast(
        "لا يمكن إضافة كمية إضافية من هذا المنتج"
      );

    }else{

      toast(
        "المتاح لك حاليًا: " +
        remaining +
        " فقط"
      );

    }


    return;

  }


  if(item){

    item.quantity =
      existingQuantity +
      quantity;

  }

  else{

    cart.push({

      id:id,

      name:
        String(
          product.name || ""
        ),

      price:
        Number(
          product.price || 0
        ),

      image:
        images[0] ||
        String(
          product.image || ""
        ),

      quantity:
        quantity

    });

  }


  saveCart();


  updateCartCount();


  toast(

    String(
      product.name ||
      "المنتج"
    ) +

    " تمت إضافته إلى السلة"

  );


  trackAddToCart(
    quantity
  );

}


/* =========================================================
   META — ADD TO CART
========================================================= */

function trackAddToCart(quantity){

  if(
    typeof fbq !== "function" ||
    !product
  ){

    return;

  }


  try{

    fbq(

      "track",

      "AddToCart",

      {

        content_ids:[
          String(product.id)
        ],

        content_type:"product",

        content_name:
          String(
            product.name || ""
          ),

        value:
          Number(
            product.price || 0
          ) *
          Number(
            quantity || 1
          ),

        currency:"USD"

      }

    );

  }catch(error){

    console.warn(
      "Meta AddToCart error:",
      error
    );

  }

}


/* =========================================================
   SAVE CART
========================================================= */

function saveCart(){

  localStorage.setItem(

    "hz_cart",

    JSON.stringify(cart)

  );

}


/* =========================================================
   CART COUNT
========================================================= */

function updateCartCount(){

  const count =
    cart.reduce(

      (total,item)=>

        total +

        Math.max(

          0,

          Number(
            item.quantity || 0
          )

        ),

      0

    );


  const mobile =
    document.getElementById(
      "mobileCartCount"
    );


  if(mobile){

    mobile.textContent =
      count;

  }

}


/* =========================================================
   FAVORITE CHECK
========================================================= */

function isFavorite(){

  if(!product){

    return false;

  }


  const id =
    Number(product.id);


  return favorites.some(

    item =>

      Number(

        typeof item === "object"

          ? item.id

          : item

      ) === id

  );

}


/* =========================================================
   TOGGLE FAVORITE
========================================================= */

function toggleFavorite(){

  if(!product){

    return;

  }


  const id =
    Number(product.id);


  const index =
    favorites.findIndex(

      item =>

        Number(

          typeof item === "object"

            ? item.id

            : item

        ) === id

    );


  if(index >= 0){

    favorites.splice(
      index,
      1
    );


    toast(
      "تمت إزالة المنتج من المفضلة"
    );

  }

  else{

    favorites.push({

      id:id,

      name:
        String(
          product.name || ""
        ),

      price:
        Number(
          product.price || 0
        ),

      image:
        images[0] ||
        String(
          product.image || ""
        )

    });


    toast(
      "تمت إضافة المنتج إلى المفضلة"
    );

  }


  saveFavorites();

  updateFavoriteCount();

  updateFavoriteButton();

}


/* =========================================================
   SAVE FAVORITES
========================================================= */

function saveFavorites(){

  localStorage.setItem(

    "hz_fav",

    JSON.stringify(
      favorites
    )

  );

}


/* =========================================================
   FAVORITE COUNT
========================================================= */

function updateFavoriteCount(){

  const count =
    favorites.length;


  const badge =
    document.getElementById(
      "favCount"
    );


  if(badge){

    badge.textContent =
      count;

  }


  const mobile =
    document.getElementById(
      "mobileFavCount"
    );


  if(mobile){

    mobile.textContent =
      count;

  }

}


/* =========================================================
   FAVORITE BUTTON
========================================================= */

function updateFavoriteButton(){

  const button =
    document.getElementById(
      "favoriteButton"
    );


  if(!button){

    return;

  }


  if(isFavorite()){

    button.classList.add(
      "active"
    );


    button.innerHTML =
      "♥ تمت الإضافة إلى المفضلة";

  }

  else{

    button.classList.remove(
      "active"
    );


    button.innerHTML =
      "♡ إضافة إلى المفضلة";

  }

}

  window.location.href =

}


/* =========================================================
   SEARCH
========================================================= */

const headerSearch =
  document.getElementById(
    "headerSearch"
  );


const searchClear =
  document.getElementById(
    "searchClear"
  );


if(headerSearch){

  headerSearch.addEventListener(
    "input",
    function(){

      if(searchClear){

        searchClear.style.display =
          headerSearch.value
            ? "block"
            : "none";

      }

    }
  );


  headerSearch.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        headerSearch.value.trim()
      ){

        window.location.href =
          "/?search=" +
          encodeURIComponent(
            headerSearch.value.trim()
          );

      }

    }
  );

}


if(searchClear){

  searchClear.addEventListener(
    "click",
    function(){

      if(headerSearch){

        headerSearch.value =
          "";

        searchClear.style.display =
          "none";

        headerSearch.focus();

      }

    }
  );

}

    `;

}


/* =========================================================
   TOUCH SWIPE
========================================================= */

let touchStartX = 0;


document.addEventListener(

  "touchstart",

  event=>{

    if(

      event.touches &&
      event.touches.length

    ){

      touchStartX =
        event.touches[0].clientX;

    }

  },

  {
    passive:true
  }

);


document.addEventListener(

  "touchend",

  event=>{

    if(!media.length){

      return;

    }


    if(

      !event.changedTouches ||
      !event.changedTouches.length

    ){

      return;

    }


    const endX =
      event.changedTouches[0].clientX;


    const difference =
      touchStartX -
      endX;


    if(
      Math.abs(difference) < 45
    ){

      return;

    }


    if(difference > 0){

      changeImage(
        currentImage + 1
      );

    }

    else{

      changeImage(
        currentImage - 1
      );

    }

  },

  {
    passive:true
  }

);


/* =========================================================
   ENTER = ADD TO CART
========================================================= */

document.addEventListener(

  "keydown",

  event=>{

    if(
      event.key !== "Enter"
    ){

      return;

    }


    const active =
      document.activeElement;


    if(

      active &&
      active.id === "quantity"

    ){

      event.preventDefault();

      addToCart();

    }

  }

);

   INITIALIZE
========================================================= */

loadProduct();

updateCartCount();

updateFavoriteCount();
