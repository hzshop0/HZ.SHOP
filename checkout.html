<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>تأكيد الطلب | HZ.SHOP</title>
<meta
  name="description"
  content="تأكيد طلبك من HZ.SHOP"
>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f7f7f7;
  color:#111;
}
header{
  background:#111;
  color:#d4af37;
  padding:18px 16px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
header a{
  display:inline-block;
  margin-top:8px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
}
.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}
.checkout-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.box{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}
.box h2{
  margin-top:0;
  font-size:20px;
}
label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:bold;
}
input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
  background:#fff;
}
input:focus,
textarea:focus,
select:focus{
  outline:none;
  border-color:#d4af37;
  box-shadow:0 0 0 2px rgba(212,175,55,.08);
}
textarea{
  min-height:90px;
  resize:vertical;
}
.customer-status{
  margin-bottom:15px;
  padding:11px 13px;
  border-radius:9px;
  background:#f7f7f7;
  color:#555;
  font-size:13px;
  line-height:1.6;
}
.customer-status.logged-in{
  background:#f4fbf4;
  border:1px solid #d8ecd8;
  color:#187018;
}
.customer-status.guest{
  background:#fafafa;
  border:1px solid #eee;
  color:#666;
}
.saved-address-note{
  margin-top:10px;
  padding:10px 12px;
  border-radius:9px;
  background:#fffaf0;
  border:1px solid #ead9a0;
  color:#6d5700;
  font-size:12px;
  line-height:1.6;
}
.payment{
  margin-top:18px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fafafa;
}
.payment label{
  margin:0;
  display:flex;
  align-items:center;
  gap:8px;
}
.payment input{
  width:auto;
}
.cart-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.cart-item:last-child{
  border-bottom:0;
}
.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
  background:#f2f2f2;
}
.cart-info{
  flex:1;
}
.cart-info strong{
  display:block;
  margin-bottom:5px;
}
.cart-info small{
  color:#666;
}
.summary{
  margin-top:18px;
  border-top:1px solid #eee;
  padding-top:15px;
}
.summary-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:10px 0;
}
.summary-row span{
  color:#555;
}
.summary-row strong{
  font-size:16px;
}
.delivery-highlight{
  margin-top:14px;
  padding:14px 16px;
  border:2px solid #d4af37;
  border-radius:12px;
  background:#fffdf3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  font-weight:bold;
}
.delivery-highlight span{
  color:#111;
  font-size:16px;
}
.delivery-highlight strong{
  color:#b18a00;
  font-size:20px;
}
.delivery-note{
  margin-top:8px;
  padding:9px 12px;
  border-radius:8px;
  background:#f8f8f8;
  color:#555;
  font-size:13px;
  text-align:center;
}
.total{
  margin-top:15px;
  padding-top:15px;
  border-top:2px solid #111;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:21px;
  font-weight:bold;
}
.total strong{
  color:#b18a00;
}
.coupon-box{
  display:flex;
  gap:8px;
  margin-top:15px;
}
.coupon-box input{
  flex:1;
}
button{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.coupon-btn{
  background:#111;
  color:#d4af37;
}
.order-btn{
  width:100%;
  margin-top:18px;
  background:#111;
  color:#d4af37;
  font-size:18px;
  padding:15px;
}
.order-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.message{
  margin-top:12px;
  padding:12px;
  border-radius:9px;
  display:none;
}
.message.error{
  display:block;
  background:#ffeaea;
  color:#a00000;
}
.message.success{
  display:block;
  background:#eaffea;
  color:#087508;
}
.empty{
  text-align:center;
  padding:30px 10px;
  color:#777;
}
.success-box{
  text-align:center;
  padding:35px 20px;
}
.success-box h2{
  color:#168316;
}
.success-box .order-number{
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}
@media(max-width:800px){
  .checkout-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<header>
  HZ.SHOP
  <br>
  <a href="/#shop">
    العودة إلى المتجر
  </a>
</header>
<div class="container">
  <div
    id="checkoutArea"
    class="checkout-grid"
  >
    <!-- =========================
         CUSTOMER INFORMATION
    ========================= -->
    <div class="box">
      <h2>
        معلومات التوصيل
      </h2>
      <div
        id="customerStatus"
        class="customer-status guest"
      >
        جاري التحقق من حسابك...
      </div>
      <label for="customer_name">
        الاسم الكامل
      </label>
      <input
        id="customer_name"
        type="text"
        placeholder="اكتب اسمك الكامل"
        autocomplete="name"
      >
      <label for="phone">
        رقم الهاتف
      </label>
      <input
        id="phone"
        type="tel"
        inputmode="tel"
        placeholder="مثال: 03xxxxxx"
        autocomplete="tel"
      >
      <label for="governorate">
        المحافظة
      </label>
      <input
        id="governorate"
        type="text"
        placeholder="المحافظة"
        autocomplete="address-level1"
      >
      <label for="area">
        المنطقة
      </label>
      <input
        id="area"
        type="text"
        placeholder="المنطقة"
        autocomplete="address-level2"
      >
      <label for="address">
        العنوان
      </label>
      <textarea
        id="address"
        placeholder="اكتب العنوان بالتفصيل"
        autocomplete="street-address"
      ></textarea>
      <label for="notes">
        ملاحظات إضافية
      </label>
      <textarea
        id="notes"
        placeholder="أي ملاحظات خاصة بالطلب (اختياري)"
      ></textarea>
      <div
        id="savedAddressNote"
        class="saved-address-note"
        style="display:none;"
      ></div>
      <div class="payment">
        <label>
          <input
            type="radio"
            name="payment"
            value="cash"
            checked
          >
          الدفع عند الاستلام
        </label>
      </div>
      <div
        id="message"
        class="message"
      ></div>
      <button
        id="orderBtn"
        class="order-btn"
        onclick="submitOrder()"
      >
        تأكيد الطلب
      </button>
    </div>
    <!-- =========================
         ORDER SUMMARY
    ========================= -->
    <div class="box">
      <h2>
        ملخص الطلب
      </h2>
      <div id="cartItems"></div>
      <div class="coupon-box">
        <input
          id="coupon"
          type="text"
          placeholder="رمز الخصم"
          autocomplete="off"
        >
        <button
          class="coupon-btn"
          onclick="applyCoupon()"
        >
          تطبيق
        </button>
      </div>
      <div
        id="couponMessage"
        class="message"
      ></div>
      <div class="summary">
        <div class="summary-row">
          <span>
            المجموع الفرعي
          </span>
          <strong id="subtotal">
            $0.00
          </strong>
        </div>
        <div class="summary-row">
          <span>
            الخصم
          </span>
          <strong id="discount">
            $0.00
          </strong>
        </div>
        <div class="delivery-highlight">
          <span>
            🚚 التوصيل
          </span>
          <strong id="delivery">
            $4.00
          </strong>
        </div>
        <div class="delivery-note">
          رسوم التوصيل ثابتة:
          <strong>$4.00</strong>
        </div>
        <div class="total">
          <span>
            الإجمالي
          </span>
          <strong id="total">
            $4.00
          </strong>
        </div>
      </div>
    </div>
  </div>
  <!-- =========================
       SUCCESS
  ========================= -->
  <div
    id="successArea"
    class="box success-box"
    style="display:none;"
  >
    <h2>
      تم إرسال طلبك بنجاح ✅
    </h2>
    <div class="order-number">
      رقم الطلب:
      <span id="successOrderNumber"></span>
    </div>
    <p>
      شكرًا لطلبك من HZ.SHOP.
      سيتم التواصل معك لتأكيد الطلب والتوصيل.
    </p>
    <button
      class="order-btn"
      onclick="window.location.href='/'"
    >
      العودة إلى المتجر
    </button>
  </div>
</div>
<script>
/* =========================
   CONFIG
========================= */
const API = "/api";
const CART_KEY = "hz_cart";
const DELIVERY_FEE = 4;
const COUPON_CODE = "HZ10";
const COUPON_DISCOUNT = 0.10;
/* =========================
   STATE
========================= */
let cart = [];
let products = [];
let appliedCoupon = false;
let currentCustomer = null;
let customerIsLoggedIn = false;
let defaultCustomerAddress = null;
/* =========================
   CART
========================= */
function loadCart(){
  try{
    const raw =
      localStorage.getItem(CART_KEY);
    if(!raw){
      return [];
    }
    const parsed =
      JSON.parse(raw);
    return Array.isArray(parsed)
      ? parsed
      : [];
  }catch(error){
    console.error(
      "Cart load error:",
      error
    );
    return [];
  }
}
function saveCart(){
  try{
    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );
  }catch(error){
    console.error(
      "Cart save error:",
      error
    );
  }
}
function money(value){
  const number =
    Number(value) || 0;
  return "$" + number.toFixed(2);
}
function calculateSubtotal(){
  return cart.reduce(
    (sum,item) => {
      const price =
        Number(item.price) || 0;
      const quantity =
        Number(item.quantity) || 0;
      return sum + (price * quantity);
    },
    0
  );
}
function calculateDiscount(subtotal){
  if(!appliedCoupon){
    return 0;
  }
  return subtotal * COUPON_DISCOUNT;
}
function calculateDelivery(subtotal){
  return subtotal > 0
    ? DELIVERY_FEE
    : 0;
}
function calculateTotals(){
  const subtotal =
    calculateSubtotal();
  const discount =
    calculateDiscount(subtotal);
  const delivery =
    calculateDelivery(subtotal);
  const total =
    Math.max(
      0,
      subtotal - discount + delivery
    );
  return {
    subtotal,
    discount,
    delivery,
    total
  };
}
/* =========================
   PRODUCTS
========================= */
async function loadProducts(){
  const response =
    await fetch(
      API + "/products",
      {
        method:"GET",
        cache:"no-store"
      }
    );
  if(!response.ok){
    throw new Error(
      "تعذر تحميل المنتجات"
    );
  }
  const data =
    await response.json();
  if(Array.isArray(data)){
    products = data;
  }else if(
    Array.isArray(data.products)
  ){
    products = data.products;
  }else{
    products = [];
  }
}
function getProductId(item){
  return Number(
    item.id ??
    item.product_id ??
    item.productId
  );
}
function getProductById(id){
  return products.find(
    product =>
      Number(
        product.id ??
        product.Id
      ) === Number(id)
  );
}
function getStock(product){
  const stock =
    Number(
      product?.stock ??
      product?.Stock ??
      0
    );
  return Number.isFinite(stock)
    ? Math.max(0,stock)
    : 0;
}
function syncCartStock(){
  cart =
    cart
      .map(item => {
        const product =
          getProductById(
            getProductId(item)
          );
        if(!product){
          return item;
        }
        const stock =
          getStock(product);
        const quantity =
          Math.min(
            Math.max(
              1,
              Number(item.quantity) || 1
            ),
            stock
          );
        return {
          ...item,
          quantity
        };
      })
      .filter(item => {
        const product =
          getProductById(
            getProductId(item)
          );
        if(!product){
          return true;
        }
        return getStock(product) > 0;
      });
  saveCart();
}
/* =========================
   CART RENDER
========================= */
function renderCart(){
  const container =
    document.getElementById(
      "cartItems"
    );
  if(!cart.length){
    container.innerHTML = `
      <div class="empty">
        السلة فارغة
      </div>
    `;
    updateTotals();
    return;
  }
  container.innerHTML =
    cart
      .map(item => {
        const product =
          getProductById(
            getProductId(item)
          );
        const name =
          item.name ||
          product?.name ||
          "منتج";
        const price =
          Number(
            item.price ??
            product?.price
          ) || 0;
        const quantity =
          Number(item.quantity) || 1;
        const image =
          item.image ||
          product?.image ||
          product?.image_url ||
          "";
        return `
          <div class="cart-item">
            ${
              image
                ? `
                  <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                  >
                `
                : `
                  <div
                    style="
                      width:65px;
                      height:65px;
                      border-radius:10px;
                      background:#f2f2f2;
                    "
                  ></div>
                `
            }
            <div class="cart-info">
              <strong>
                ${escapeHtml(name)}
              </strong>
              <small>
                ${quantity} × ${money(price)}
              </small>
            </div>
            <strong>
              ${money(price * quantity)}
            </strong>
          </div>
        `;
      })
      .join("");
  updateTotals();
}
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function updateTotals(){
  const totals =
    calculateTotals();
  document.getElementById(
    "subtotal"
  ).textContent =
    money(totals.subtotal);
  document.getElementById(
    "discount"
  ).textContent =
    money(totals.discount);
  document.getElementById(
    "delivery"
  ).textContent =
    money(totals.delivery);
  document.getElementById(
    "total"
  ).textContent =
    money(totals.total);
}
/* =========================
   COUPON
========================= */
function applyCoupon(){
  const input =
    document.getElementById(
      "coupon"
    );
  const message =
    document.getElementById(
      "couponMessage"
    );
  const code =
    input.value
      .trim()
      .toUpperCase();
  message.className =
    "message";
  if(!code){
    appliedCoupon = false;
    message.textContent =
      "أدخل رمز الخصم أولًا.";
    message.className =
      "message error";
    updateTotals();
    return;
  }
  if(code === COUPON_CODE){
    appliedCoupon = true;
    message.textContent =
      "تم تطبيق خصم 10% بنجاح ✅";
    message.className =
      "message success";
  }else{
    appliedCoupon = false;
    message.textContent =
      "رمز الخصم غير صحيح.";
    message.className =
      "message error";
  }
  updateTotals();
}
/* =========================
   CUSTOMER STORAGE
========================= */
/*
  account.html يستخدم:
  getCustomerStorageKey("hz_customer_addresses")
  وبحسب نظام الحساب، المفتاح النهائي
  مرتبط بمعرّف العميل.
  لذلك نستخدم نفس النمط هنا.
*/
function getCustomerAddressesStorageKey(){

  if(!currentCustomer){
    return "";
  }

  const id =
    currentCustomer?.id ??
    currentCustomer?.phone ??
    "guest";

  return "hz_customer_addresses_" +
    String(id);

}
function loadCustomerAddresses(){
  const key =
    getCustomerAddressesStorageKey();
  if(!key){
    return [];
  }
  try{
    const raw =
      localStorage.getItem(key);
    if(!raw){
      return [];
    }
    const parsed =
      JSON.parse(raw);
    return Array.isArray(parsed)
      ? parsed
      : [];
  }catch(error){
    console.error(
      "CUSTOMER_ADDRESS_LOAD_ERROR",
      error
    );
    return [];
  }
}
function getDefaultCustomerAddress(){

  const addresses =
    loadCustomerAddresses();

  console.log(
    "CUSTOMER ADDRESSES:",
    addresses
  );

  if(!addresses.length){
    console.log(
      "NO CUSTOMER ADDRESS FOUND"
    );

    return null;
  }

  const defaultAddress =
    addresses.find(
      address =>
        address &&
        address.isDefault === true
    ) ||
    addresses[0] ||
    null;

  console.log(
    "DEFAULT CUSTOMER ADDRESS:",
    defaultAddress
  );

  return defaultAddress;

}
/* =========================
   CUSTOMER SESSION
========================= */
async function loadCustomerSession(){
  try{
    const response =
      await fetch(
        API + "/customer-me",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );
    const data =
  await response.json()
    .catch(() => ({}));
alert(
  JSON.stringify({
    status: response.status,
    logged_in: data.logged_in,
    customer: data.customer || null
  })
);
console.log(
  "CHECKOUT CUSTOMER SESSION:",
  response.status,
  data
);
    if(
      response.ok &&
      data.logged_in === true &&
      data.customer
    ){
      currentCustomer =
        data.customer;
      customerIsLoggedIn = true;
      defaultCustomerAddress =
        getDefaultCustomerAddress();
      fillCustomerData();
      updateCustomerStatus();
      return true;
    }
    currentCustomer = null;
    customerIsLoggedIn = false;
    defaultCustomerAddress = null;
    updateCustomerStatus();
    return false;
  }catch(error){
    console.error(
      "CUSTOMER_SESSION_ERROR",
      error
    );
    currentCustomer = null;
    customerIsLoggedIn = false;
    defaultCustomerAddress = null;
    updateCustomerStatus();
    return false;
  }
}
/* =========================
   FILL CUSTOMER DATA
========================= */
function fillCustomerData(){
  if(!currentCustomer){
    return;
  }
  const nameInput =
    document.getElementById(
      "customer_name"
    );
  const phoneInput =
    document.getElementById(
      "phone"
    );
  const governorateInput =
    document.getElementById(
      "governorate"
    );
  const areaInput =
    document.getElementById(
      "area"
    );
  const addressInput =
    document.getElementById(
      "address"
    );
  const notesInput =
    document.getElementById(
      "notes"
    );
  /*
    بيانات الحساب الأساسية
  */
  if(
    nameInput &&
    !nameInput.value.trim()
  ){
    nameInput.value =
      currentCustomer.name || "";
  }
  if(
    phoneInput &&
    !phoneInput.value.trim()
  ){
    phoneInput.value =
      currentCustomer.phone || "";
  }
  /*
    العنوان الافتراضي
  */
  const address =
    defaultCustomerAddress;
  if(!address){
    return;
  }
  /*
    account.html:
    city = المدينة / المنطقة
  */
  if(
    areaInput &&
    !areaInput.value.trim()
  ){
    areaInput.value =
      address.city || "";
  }
  if(
    addressInput &&
    !addressInput.value.trim()
  ){
    addressInput.value =
      address.address || "";
  }
  if(
    notesInput &&
    !notesInput.value.trim()
  ){
    notesInput.value =
      address.notes || "";
  }
  showSavedAddressNote(address);
}
function showSavedAddressNote(address){
  const note =
    document.getElementById(
      "savedAddressNote"
    );
  if(
    !note ||
    !address
  ){
    return;
  }
  const label =
    address.label ||
    "العنوان الافتراضي";
  note.innerHTML =
    `
      📍 تم تحميل
      <strong>${escapeHtml(label)}</strong>
      تلقائيًا من عناوين حسابك.
      يمكنك تعديل البيانات قبل تأكيد الطلب.
    `;
  note.style.display =
    "block";
}
/* =========================
   CUSTOMER STATUS
========================= */
function updateCustomerStatus(){
  const status =
    document.getElementById(
      "customerStatus"
    );
  if(!status){
    return;
  }
  if(customerIsLoggedIn){
    const name =
      currentCustomer?.name ||
      "العميل";
    status.className =
      "customer-status logged-in";
    status.innerHTML =
      `
        مرحبًا
        <strong>${escapeHtml(name)}</strong>
        👋
        <br>
        تم تحميل بيانات حسابك تلقائيًا،
        ويمكنك تعديلها قبل تأكيد الطلب.
      `;
  }else{
    status.className =
      "customer-status guest";
    status.innerHTML =
      `
        أنت تتابع كزائر.
        يمكنك إدخال بيانات التوصيل يدويًا.
      `;
  }
}
/* =========================
   STOCK VALIDATION
========================= */
async function validateCartStock(){
  await loadProducts();
  for(const item of cart){
    const id =
      getProductId(item);
    const product =
      getProductById(id);
    if(!product){
      return {
        ok:false,
        message:"أحد المنتجات لم يعد متوفرًا."
      };
    }
    const stock =
      getStock(product);
    const quantity =
      Number(item.quantity) || 0;
    if(stock <= 0){
      return {
        ok:false,
        message:
          `المنتج "${product.name}" غير متوفر حاليًا.`
      };
    }
    if(quantity > stock){
      return {
        ok:false,
        message:
          `الكمية المطلوبة من "${product.name}" أكبر من الكمية المتوفرة. المتوفر: ${stock}`
      };
    }
  }
  return {
    ok:true
  };
}
/* =========================
   MESSAGE
========================= */
function showMessage(
  text,
  type="error"
){
  const message =
    document.getElementById(
      "message"
    );
  message.textContent =
    text;
  message.className =
    "message " + type;
}
/* =========================
   SUBMIT ORDER
========================= */
async function submitOrder(){
  const button =
    document.getElementById(
      "orderBtn"
    );
  button.disabled = true;
  showMessage(
    "",
    "success"
  );
  try{
    /* =========================
       CART
    ========================= */
    if(!cart.length){
      showMessage(
        "السلة فارغة.",
        "error"
      );
      button.disabled = false;
      return;
    }
    /* =========================
       CUSTOMER DATA
    ========================= */
    const name =
      document.getElementById(
        "customer_name"
      ).value.trim();
    const phone =
      document.getElementById(
        "phone"
      ).value.trim();
    const governorate =
      document.getElementById(
        "governorate"
      ).value.trim();
    const area =
      document.getElementById(
        "area"
      ).value.trim();
    const address =
      document.getElementById(
        "address"
      ).value.trim();
    const notes =
      document.getElementById(
        "notes"
      ).value.trim();
    /* =========================
       VALIDATION
    ========================= */
    if(!name){
      showMessage(
        "يرجى إدخال الاسم الكامل.",
        "error"
      );
      button.disabled = false;
      return;
    }
    if(!phone){
      showMessage(
        "يرجى إدخال رقم الهاتف.",
        "error"
      );
      button.disabled = false;
      return;
    }
    if(!governorate){
      showMessage(
        "يرجى إدخال المحافظة.",
        "error"
      );
      button.disabled = false;
      return;
    }
    if(!area){
      showMessage(
        "يرجى إدخال المنطقة.",
        "error"
      );
      button.disabled = false;
      return;
    }
    if(!address){
      showMessage(
        "يرجى إدخال العنوان.",
        "error"
      );
      button.disabled = false;
      return;
    }
    /* =========================
       STOCK
    ========================= */
    const stockCheck =
      await validateCartStock();
    if(!stockCheck.ok){
      showMessage(
        stockCheck.message,
        "error"
      );
      renderCart();
      button.disabled = false;
      return;
    }
    /* =========================
       VERIFIED ITEMS
    ========================= */
    const verifiedItems =
      cart.map(item => {
        const product =
          getProductById(
            getProductId(item)
          );
        return {
          id:
            Number(
              getProductId(item)
            ),
          name:
            product?.name ||
            item.name ||
            "",
          price:
            Number(
              product?.price ??
              item.price
            ) || 0,
          quantity:
            Number(item.quantity) || 1,
          image:
            product?.image ||
            product?.image_url ||
            item.image ||
            ""
        };
      });
    /* =========================
       TOTALS
    ========================= */
    const totals =
      calculateTotals();
    /* =========================
       PAYLOAD
    ========================= */
    const payload = {
      customer_name:
        name,
      phone:
        phone,
      governorate:
        governorate,
      area:
        area,
      address:
        address,
      notes:
        notes,
      payment_method:
        "cash",
      items:
        verifiedItems,
      subtotal:
        totals.subtotal,
      discount:
        totals.discount,
      delivery_fee:
        totals.delivery,
      total:
        totals.total,
      coupon:
        appliedCoupon
          ? COUPON_CODE
          : null,
      /*
        إذا كان العميل مسجل الدخول:
        لا نرسله كزائر.
      */
      guest:
        !customerIsLoggedIn
    };
    /* =========================
       SEND ORDER
    ========================= */
    const response =
      await fetch(
        API + "/orders",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          credentials:"include",
          body:
            JSON.stringify(payload)
        }
      );
    const data =
      await response.json()
        .catch(() => ({}));
    if(!response.ok){
      throw new Error(
        data.message ||
        data.error ||
        "تعذر إرسال الطلب."
      );
    }
    /* =========================
       SAVE CURRENT ADDRESS
       LOCALLY FOR CUSTOMER
    ========================= */
    if(customerIsLoggedIn){
      saveCurrentAddressForCustomer({
        recipient:name,
        phone:phone,
        address:address,
        city:area,
        notes:notes
      });
    }
    /* =========================
       CLEAR CART
    ========================= */
    localStorage.removeItem(
      CART_KEY
    );
    cart = [];
    renderSuccess(data);
  }catch(error){
    console.error(
      "Submit order error:",
      error
    );
    showMessage(
      error.message ||
      "حدث خطأ أثناء إرسال الطلب.",
      "error"
    );
  }finally{
    button.disabled = false;
  }
}
/* =========================
   SAVE CURRENT ADDRESS
========================= */
function saveCurrentAddressForCustomer(data){
  if(!currentCustomer){
    return false;
  }
  const key =
    getCustomerAddressesStorageKey();
  if(!key){
    return false;
  }
  try{
    const addresses =
      loadCustomerAddresses();
    /*
      إذا كان هناك عنوان بنفس البيانات الأساسية،
      لا ننشئ نسخة جديدة.
    */
    const existingIndex =
      addresses.findIndex(
        item =>
          String(item.address || "").trim() ===
            String(data.address || "").trim() &&
          String(item.phone || "").trim() ===
            String(data.phone || "").trim()
      );
    if(existingIndex !== -1){
      addresses[existingIndex] = {
        ...addresses[existingIndex],
        recipient:
          data.recipient ||
          addresses[existingIndex].recipient ||
          "",
        phone:
          data.phone ||
          addresses[existingIndex].phone ||
          "",
        address:
          data.address ||
          addresses[existingIndex].address ||
          "",
        city:
          data.city ||
          addresses[existingIndex].city ||
          "",
        notes:
          data.notes ||
          addresses[existingIndex].notes ||
          ""
      };
    }else{
      addresses.push({
        id:
          Date.now().toString(36) +
          Math.random()
            .toString(36)
            .slice(2,7),
        label:
          "آخر عنوان مستخدم",
        recipient:
          data.recipient || "",
        phone:
          data.phone || "",
        address:
          data.address || "",
        city:
          data.city || "",
        notes:
          data.notes || "",
        isDefault:
          addresses.length === 0
      });
    }
    localStorage.setItem(
      key,
      JSON.stringify(addresses)
    );
    return true;
  }catch(error){
    console.error(
      "SAVE_CURRENT_ADDRESS_ERROR",
      error
    );
    return false;
  }
}
/* =========================
   SUCCESS
========================= */
function renderSuccess(data){
  document.getElementById(
    "checkoutArea"
  ).style.display =
    "none";
  const successArea =
    document.getElementById(
      "successArea"
    );
  successArea.style.display =
    "block";
  const orderNumber =
    data?.order_id ??
    data?.orderId ??
    data?.id ??
    data?.order?.id ??
    "";
  document.getElementById(
    "successOrderNumber"
  ).textContent =
    orderNumber ||
    "تم تسجيل الطلب";
}
/* =========================
   INIT
========================= */
async function init(){
  cart =
    loadCart();
  try{
    /*
      نحمل المنتجات والعميل معًا
      حتى لا نؤخر صفحة الطلب.
    */
    await Promise.all([
      loadProducts(),
      loadCustomerSession()
    ]);
    syncCartStock();
    renderCart();
  }catch(error){
    console.error(
      "Initialization error:",
      error
    );
    renderCart();
    showMessage(
      "تعذر تحميل معلومات المنتجات. حاول مرة أخرى.",
      "error"
    );
  }
}
init();
</script>
