<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HZ.SHOP | Luxury Store</title>

    <meta
        name="description"
        content="HZ.SHOP متجر العطور ومنتجات العناية والجمال"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <link
        rel="manifest"
        href="/manifest.webmanifest"
    >

    <link
        rel="stylesheet"
        href="/css/main.css"
    >

</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header id="site-header"></header>


    <!-- MAIN -->
    <main id="main-content">

        <section id="hero-section"></section>

        <section id="categories-section"></section>

        <section id="featured-products-section"></section>

        <section id="offers-section"></section>

        <section id="best-sellers-section"></section>

        <section id="new-arrivals-section"></section>

        <section id="trending-section"></section>

        <section id="recommendations-section"></section>

        <section id="brands-section"></section>

        <section id="benefits-section"></section>

        <section id="reviews-section"></section>

        <section id="newsletter-section"></section>

        <section id="cta-section"></section>

    </main>


    <!-- FOOTER -->
    <footer id="site-footer"></footer>


    <!-- MOBILE NAVIGATION -->
    <nav id="bottom-navigation"></nav>


    <!-- TOAST -->
    <div id="toast-container"></div>

</div>


<!-- =====================================================
     CORE
     ===================================================== -->

<script src="/js/core/storage.js"></script>
<script src="/js/core/utils.js"></script>
<script src="/js/core/state.js"></script>
<script src="/js/core/api.js"></script>


<!-- =====================================================
     ANALYTICS
     ===================================================== -->

<script src="/js/analytics/analytics.js"></script>


<!-- =====================================================
     FEATURES
     ===================================================== -->

<script src="/js/features/cart.js"></script>
<script src="/js/features/categories.js"></script>
<script src="/js/features/customer.js"></script>
<script src="/js/features/favorites.js"></script>
<script src="/js/features/notifications.js"></script>
<script src="/js/features/product.js"></script>
<script src="/js/features/recent.js"></script>
<script src="/js/features/search.js"></script>
<script src="/js/features/checkout.js"></script>
<script src="/components/product-card/product-card.js"></script>

<!-- =====================================================
     NAVIGATION
     ===================================================== -->

<script src="/js/navigation/history.js"></script>
<script src="/js/navigation/navigation.js"></script>
<script src="/js/navigation/redirect.js"></script>
<script src="/js/navigation/scroll.js"></script>


<!-- =====================================================
     COMPONENTS
     ===================================================== -->

<script src="/components/header/header.js"></script>
<script src="/components/footer/footer.js"></script>
<script src="/components/bottom-nav/bottom-nav.js"></script>
<script src="/components/section/section.js"></script>
<script src="/js/components/dropdown.js"></script>
<script src="/js/components/loader.js"></script>
<script src="/js/components/modal.js"></script>
<script src="/js/components/tabs.js"></script>
<script src="/js/components/toast.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if (
            typeof HEADER !== "undefined" &&
            typeof HEADER.init === "function"
        ) {
            HEADER.init();
        }


        if (
            typeof FOOTER !== "undefined" &&
            typeof FOOTER.init === "function"
        ) {
            FOOTER.init();
        }


        if (
            typeof HZBottomNav !== "undefined" &&
            typeof HZBottomNav.init === "function"
        ) {
            HZBottomNav.init();
        }

    }
);

</script>

</body>

</html>
