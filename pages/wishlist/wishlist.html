<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HZ.shop | المفضلة</title>

  <meta
    name="description"
    content="المنتجات المفضلة في HZ.shop"
  >

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/pages/wishlist/wishlist.css"
  >

</head>

<body>

<div id="app">

  <header id="site-header"></header>


  <main class="wishlist-page">

    <div class="wishlist-page-container">

      <header class="wishlist-page-header">

        <div>

          <h1 class="wishlist-page-title">
            المفضلة
          </h1>

          <p
            class="wishlist-page-subtitle"
            data-wishlist-subtitle
            hidden
          ></p>

        </div>


        <button
          type="button"
          class="wishlist-clear-button"
          data-wishlist-clear
          hidden
        >
          حذف الكل
        </button>

      </header>


      <div
        class="wishlist-loading"
        data-wishlist-loading
      >
        جاري تحميل المفضلة...
      </div>


      <section
        class="wishlist-products"
        data-wishlist-products
        aria-live="polite"
      ></section>


      <section
        class="wishlist-empty"
        data-wishlist-empty
        hidden
      >

        <div
          class="wishlist-empty-icon"
          aria-hidden="true"
        >
          ♡
        </div>

        <h2>
          لا توجد منتجات في المفضلة
        </h2>

        <p>
          أضف المنتجات التي تعجبك إلى المفضلة لتجدها هنا بسهولة.
        </p>

        <a
          href="/"
          class="wishlist-empty-button"
        >
          متابعة التسوق
        </a>

      </section>


      <div
        class="wishlist-pagination-container"
        data-pagination-container
      ></div>

    </div>

  </main>


  <footer id="site-footer"></footer>

  <nav id="bottom-navigation"></nav>

  <div id="toast-container"></div>

</div>


<!-- =========================================================
     CORE
     ========================================================= -->

<script src="/js/core/storage.js"></script>
<script src="/js/core/utils.js"></script>
<script src="/js/core/state.js"></script>
<script src="/js/core/api.js"></script>


<!-- =========================================================
     ANALYTICS
     ========================================================= -->

<script src="/js/analytics/analytics.js"></script>


<!-- =========================================================
     FEATURES
     ========================================================= -->

<script src="/js/features/cart.js"></script>
<script src="/js/features/customer.js"></script>
<script src="/js/features/favorites.js"></script>
<script src="/js/features/notifications.js"></script>
<script src="/js/features/product.js"></script>
<script src="/js/features/recent.js"></script>
<script src="/js/features/search.js"></script>


<!-- =========================================================
     NAVIGATION
     ========================================================= -->

<script src="/js/navigation/history.js"></script>
<script src="/js/navigation/navigation.js"></script>
<script src="/js/navigation/redirect.js"></script>
<script src="/js/navigation/scroll.js"></script>


<!-- =========================================================
     COMPONENTS
     ========================================================= -->

<script src="/components/header/header.js"></script>
<script src="/components/footer/footer.js"></script>
<script src="/components/bottom-nav/bottom-nav.js"></script>

<script src="/components/product-card/product-card.js"></script>

<script src="/js/components/loader.js"></script>
<script src="/js/components/modal.js"></script>
<script src="/js/components/pagination.js"></script>
<script src="/js/components/toast.js"></script>


<!-- =========================================================
     WISHLIST PAGE
     ========================================================= -->

<script src="/pages/wishlist/wishlist.js"></script>

</body>

</html>
