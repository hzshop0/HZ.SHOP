<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HZ.shop | الإشعارات</title>

  <meta
    name="description"
    content="إشعارات HZ.shop"
  >

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/pages/notifications/notifications.css"
  >

</head>


<body>

<div id="app">

  <header id="site-header"></header>

  <main class="notifications-page">

    <div class="notifications-page-container">

      <header class="notifications-page-header">

        <div>

          <h1 class="notifications-page-title">
            الإشعارات
          </h1>

          <p
            class="notifications-page-subtitle"
            data-notifications-subtitle
            hidden
          ></p>

        </div>

        <button
          type="button"
          class="notifications-read-button"
          data-notifications-read
          hidden
        >
          تحديد الكل كمقروء
        </button>

      </header>


      <div
        class="notifications-loading"
        data-notifications-loading
      >
        جاري تحميل الإشعارات...
      </div>


      <section
        class="notifications-list"
        data-notifications-list
        aria-live="polite"
      ></section>


      <section
        class="notifications-empty"
        data-notifications-empty
        hidden
      >

        <div
          class="notifications-empty-icon"
          aria-hidden="true"
        >
          🔔
        </div>

        <h2>
          لا توجد إشعارات
        </h2>

        <p>
          ستظهر هنا آخر التحديثات والعروض الخاصة بك.
        </p>

        <a
          href="/"
          class="notifications-empty-button"
        >
          العودة للرئيسية
        </a>

      </section>

    </div>

  </main>


  <footer id="site-footer"></footer>

  <nav id="bottom-navigation"></nav>

  <div id="toast-container"></div>

</div>


<script src="/js/core/storage.js"></script>
<script src="/js/core/utils.js"></script>
<script src="/js/core/state.js"></script>
<script src="/js/core/api.js"></script>

<script src="/js/analytics/analytics.js"></script>

<script src="/js/features/cart.js"></script>
<script src="/js/features/customer.js"></script>
<script src="/js/features/favorites.js"></script>
<script src="/js/features/notifications.js"></script>
<script src="/js/features/recent.js"></script>

<script src="/js/navigation/history.js"></script>
<script src="/js/navigation/navigation.js"></script>
<script src="/js/navigation/redirect.js"></script>
<script src="/js/navigation/scroll.js"></script>

<script src="/components/header/header.js"></script>
<script src="/components/footer/footer.js"></script>
<script src="/components/bottom-nav/bottom-nav.js"></script>

<script src="/js/components/loader.js"></script>
<script src="/js/components/modal.js"></script>
<script src="/js/components/toast.js"></script>

<script src="/pages/notifications/notifications.js"></script>

</body>

</html>
