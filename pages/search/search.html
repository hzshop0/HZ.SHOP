<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HZ.shop | البحث</title>

  <meta
    name="description"
    content="ابحث عن المنتجات في HZ.shop"
  >
</head>

<body>

  <main class="search-page">

    <div class="search-page-container">

      <header class="search-page-header">

        <div class="search-page-heading">
          <h1
            class="search-page-title"
            data-search-title
          >
            البحث
          </h1>

          <p
            class="search-page-query"
            data-search-query
            hidden
          ></p>
        </div>

        <form
          class="search-page-form"
          data-search-form
        >

          <input
            type="search"
            class="search-page-input"
            data-search-input
            placeholder="ابحث عن منتج..."
            autocomplete="off"
            aria-label="البحث عن المنتجات"
          >

          <button
            type="submit"
            class="search-page-button"
          >
            بحث
          </button>

        </form>

      </header>


      <div
        class="search-page-loading"
        data-search-loading
      >
        جاري البحث...
      </div>


      <section
        class="search-results"
        data-search-results
        aria-live="polite"
      ></section>


      <section
        class="search-empty"
        data-search-empty
        hidden
      >

        <div
          class="search-empty-icon"
          aria-hidden="true"
        >
          🔍
        </div>

        <h2 data-search-empty-title>
          لم يتم العثور على منتجات
        </h2>

        <p data-search-empty-text>
          جرّب البحث باستخدام كلمة أخرى.
        </p>

        <a
          href="/"
          class="search-empty-button"
        >
          العودة للرئيسية
        </a>

      </section>


      <div
        class="search-pagination-container"
        data-pagination-container
      ></div>

    </div>

  </main>

</body>
</html>
