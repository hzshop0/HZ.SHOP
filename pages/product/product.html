<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HZ.shop | المنتج</title>

  <meta
    name="description"
    content="تفاصيل المنتج في HZ.shop"
  >
</head>

<body>

  <div id="productPage">

    <main class="product-page">

      <div
        class="product-page-container"
        data-product-container
      >

        <div
          class="product-page-loading"
          data-product-loading
        >
          جاري تحميل المنتج...
        </div>

        <div
          class="product-page-content"
          data-product-content
          hidden
        >

          <section class="product-details">

            <div
              class="product-gallery-container"
              data-product-gallery-container
            ></div>

            <div class="product-info">

              <div class="product-info-header">

                <span
                  class="product-category"
                  data-product-category
                  hidden
                ></span>

                <h1
                  class="product-title"
                  data-product-title
                ></h1>

                <div
                  class="product-rating-container"
                  data-product-rating-container
                ></div>

              </div>

              <div
                class="product-price-container"
                data-product-price-container
              ></div>

              <p
                class="product-description"
                data-product-description
                hidden
              ></p>

              <div
                class="product-stock"
                data-product-stock
                hidden
              ></div>

              <div
                class="product-quantity-container"
                data-product-quantity-container
              ></div>

              <div class="product-actions">

                <button
                  type="button"
                  class="product-add-cart"
                  data-product-add-cart
                >
                  إضافة إلى السلة
                </button>

                <button
                  type="button"
                  class="product-wishlist"
                  data-product-wishlist
                  aria-label="إضافة إلى المفضلة"
                >
                  ♡
                </button>

              </div>

              <div
                class="product-meta"
                data-product-meta
              ></div>

            </div>

          </section>

          <section
            class="product-extra"
            data-product-extra
            hidden
          >

            <div class="product-extra-section">
              <h2>تفاصيل المنتج</h2>

              <div
                class="product-extra-content"
                data-product-extra-content
              ></div>
            </div>

          </section>

          <section
            class="product-related"
            data-product-related
            hidden
          >

            <div class="product-related-header">

              <h2>منتجات قد تعجبك</h2>

            </div>

            <div
              class="product-related-grid"
              data-product-related-grid
            ></div>

          </section>

        </div>

        <div
          class="product-page-error"
          data-product-error
          hidden
        >
          <h2>تعذر تحميل المنتج</h2>

          <p>
            حدث خطأ أثناء تحميل بيانات المنتج.
          </p>

          <button
            type="button"
            data-product-retry
          >
            إعادة المحاولة
          </button>
        </div>

      </div>

    </main>

  </div>

</body>

</html>
