<template id="priceDisplayTemplate">

  <div
    class="price-display"
    data-price-display
  >

    <span
      class="price-current"
      data-price-current
    ></span>

    <span
      class="price-old"
      data-price-old
      hidden
    ></span>

    <span
      class="price-discount"
      data-price-discount
      hidden
    ></span>

  </div>

</template>
