<template id="productCardTemplate">

  <article
    class="product-card"
    data-product-id=""
    aria-label="بطاقة المنتج"
  >

    <div class="product-card-main">

      <a
        class="product-card-link"
        href="#"
        aria-label="عرض المنتج"
      >

        <div class="product-card-image">

          <img
            class="product-card-img"
            src=""
            alt=""
            loading="lazy"
            decoding="async"
          />

          <span
            class="product-card-discount"
            hidden
            aria-label="نسبة الخصم"
          ></span>

          <button
            type="button"
            class="product-card-wishlist"
            aria-label="إضافة إلى المفضلة"
            aria-pressed="false"
          >
            <span aria-hidden="true">♡</span>
          </button>

        </div>

        <div class="product-card-content">

          <h3 class="product-card-title"></h3>

          <div
            class="product-card-rating"
            aria-label="تقييم المنتج"
          >

            <span
              class="product-card-stars"
              aria-hidden="true"
            >
              ★★★★★
            </span>

            <span class="product-card-rating-value"></span>

          </div>

          <div class="product-card-price">

            <span
              class="product-card-current-price"
            ></span>

            <span
              class="product-card-old-price"
              hidden
            ></span>

          </div>

          <div
            class="product-card-sales"
            hidden
          ></div>

        </div>

      </a>

      <button
        type="button"
        class="product-card-cart"
        aria-label="إضافة المنتج إلى السلة"
      >
        <span aria-hidden="true">+</span>
        <span>إضافة إلى السلة</span>
      </button>

    </div>

  </article>

</template>
