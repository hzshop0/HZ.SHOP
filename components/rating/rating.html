<template id="ratingTemplate">

  <div
    class="product-rating"
    data-rating
  >

    <span
      class="rating-stars"
      data-rating-stars
      aria-hidden="true"
    >
      ★★★★★
    </span>

    <span
      class="rating-value"
      data-rating-value
    ></span>

    <span
      class="rating-count"
      data-rating-count
    ></span>

  </div>

</template>
