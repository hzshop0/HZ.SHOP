<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HZ.SHOP | الإدارة</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#070707;
color:#fff
}
header{
padding:25px;
text-align:center;
border-bottom:1px solid #d4af37;
background:#111
}
.logo{
font-size:30px;
font-weight:bold;
color:#d4af37;
letter-spacing:3px
}
.container{
width:min(1050px,94%);
margin:30px auto
}
.card{
background:#111;
border:1px solid #292929;
border-radius:18px;
padding:25px;
margin-bottom:25px
}
h2{
color:#d4af37;
margin-top:0
}
input,select,textarea{
width:100%;
padding:13px;
margin-top:7px;
margin-bottom:15px;
background:#080808;
color:#fff;
border:1px solid #444;
border-radius:10px;
font-size:15px
}
textarea{
min-height:100px;
resize:vertical
}
button{
border:0;
border-radius:10px;
padding:13px 20px;
font-weight:bold;
cursor:pointer
}
.gold{
background:#d4af37;
color:#080808
}
.dark{
background:#252525;
color:#fff
}
.red{
background:#7d2222;
color:#fff
}
.hidden{
display:none!important
}
.status{
margin-top:15px;
color:#d4af37;
font-weight:bold
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.full{
grid-column:1/-1
}
.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:18px
}
.product{
background:#090909;
border:1px solid #292929;
border-radius:14px;
overflow:hidden
}
.product img{
width:100%;
height:210px;
object-fit:cover;
background:#181818
}
.info{
padding:15px
}
.name{
font-size:19px;
font-weight:bold;
color:#d4af37
}
.price{
font-size:20px;
margin:10px 0
}
.actions{
display:flex;
gap:8px;
margin-top:15px
}
.actions button{
flex:1
}
@media(max-width:650px){
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style>
</head>

<body>

<header>
<div class="logo">HZ.SHOP</div>
</header>


<div class="container">

<!-- LOGIN -->

<section id="loginCard" class="card">

<h2>🔐 دخول الإدارة</h2>

<label>كلمة مرور الإدارة</label>

<input
id="password"
type="password"
placeholder="أدخل كلمة المرور"
autocomplete="current-password"
>

<button class="gold" onclick="login()">
دخول
</button>

<div id="loginStatus" class="status"></div>

</section>


<!-- ADMIN -->

<section id="adminPanel" class="hidden">

<div class="card">

<h2 id="formTitle">إضافة منتج جديد</h2>

<form id="productForm">

<input
id="productId"
type="hidden"
>

<div class="grid">

<div>
<label>اسم المنتج</label>
<input id="name" required>
</div>

<div>
<label>القسم</label>
<select id="category" required>
<option value="">اختر القسم</option>
<option value="العطور">العطور</option>
<option value="العناية بالبشرة">العناية بالبشرة</option>
<option value="العناية الشخصية">العناية الشخصية</option>
<option value="النظافة">النظافة</option>
</select>
</div>

<div>
<label>السعر</label>
<input id="price" type="number" step="0.01" required>
</div>

<div>
<label>السعر القديم</label>
<input id="old_price" type="number" step="0.01">
</div>

<div>
<label>المخزون</label>
<input id="stock" type="number" min="0" value="0">
</div>

<div>
<label>الشارة</label>
<input id="badge" placeholder="جديد / عرض / الأكثر مبيعاً">
</div>

<div class="full">
<label>رابط الصورة مؤقتًا</label>
<input id="image" placeholder="رابط الصورة">
</div>

<div class="full">
<label>الوصف</label>
<textarea id="description"></textarea>
</div>

</div>

<button class="gold" type="submit">
حفظ المنتج
</button>

<button
class="dark"
type="button"
onclick="resetForm()"
>
إلغاء
</button>

<div id="status" class="status"></div>

</form>

</div>


<div class="card">

<h2>المنتجات</h2>

<div id="products" class="products">
جاري التحميل...
</div>

</div>

</section>

</div>


<script>

let products=[];


/* LOGIN */

async function login(){

const password=
document.getElementById("password").value;

const status=
document.getElementById("loginStatus");

if(!password){
status.textContent="أدخل كلمة المرور";
return;
}

status.textContent="جاري تسجيل الدخول...";

try{

const response=await fetch(
"/api/admin-login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
password:password
})
}
);

const result=await response.json();

if(!response.ok){
throw new Error(
result.error || "فشل تسجيل الدخول"
);
}

document
.getElementById("loginCard")
.classList.add("hidden");

document
.getElementById("adminPanel")
.classList.remove("hidden");

loadProducts();

}catch(error){

status.textContent=
"خطأ: "+error.message;

}

}


/* PRODUCTS */

async function loadProducts(){

const box=
document.getElementById("products");

try{

const response=
await fetch("/api/products");

if(!response.ok){
throw new Error("تعذر تحميل المنتجات");
}

products=
await response.json();

renderProducts();

}catch(error){

box.innerHTML=
"خطأ: "+error.message;

}

}


function renderProducts(){

const box=
document.getElementById("products");

if(!products.length){

box.innerHTML=
"لا توجد منتجات حتى الآن.";

return;

}

box.innerHTML=
products.map(product=>`

<div class="product">

<img
src="${escapeHtml(product.image || "")}"
alt="${escapeHtml(product.name || "")}"
onerror="this.style.display='none'"
>

<div class="info">

<div class="name">
${escapeHtml(product.name)}
</div>

<div>
${escapeHtml(product.category || "")}
</div>

<div class="price">
$${Number(product.price || 0).toFixed(2)}
</div>

<div>
المخزون: ${Number(product.stock || 0)}
</div>

<div class="actions">

<button
class="gold"
onclick="editProduct(${product.id})"
>
تعديل
</button>

<button
class="red"
onclick="deleteProduct(${product.id})"
>
حذف
</button>

</div>

</div>

</div>

`).join("");

}


/* SAVE */

document
.getElementById("productForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const id=
document.getElementById("productId").value;

const data={

name:
document.getElementById("name").value,

category:
document.getElementById("category").value,

price:
document.getElementById("price").value,

old_price:
document.getElementById("old_price").value,

stock:
document.getElementById("stock").value,

badge:
document.getElementById("badge").value,

image:
document.getElementById("image").value,

description:
document.getElementById("description").value

};

if(id){
data.id=id;
}

const status=
document.getElementById("status");

status.textContent=
"جاري الحفظ...";

try{

const response=
await fetch(
"/api/products",
{
method:id?"PUT":"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);

const result=
await response.json();

if(!response.ok){
throw new Error(
result.error || "حدث خطأ"
);
}

status.textContent=
id
?"تم تعديل المنتج ✅"
:"تمت إضافة المنتج ✅";

resetForm();

loadProducts();

}catch(error){

status.textContent=
"خطأ: "+error.message;

}

});


/* EDIT */

function editProduct(id){

const product=
products.find(p=>p.id==id);

if(!product)return;

document.getElementById("productId").value=
product.id;

document.getElementById("name").value=
product.name || "";

document.getElementById("category").value=
product.category || "";

document.getElementById("price").value=
product.price || "";

document.getElementById("old_price").value=
product.old_price || "";

document.getElementById("stock").value=
product.stock || 0;

document.getElementById("badge").value=
product.badge || "";

document.getElementById("image").value=
product.image || "";

document.getElementById("description").value=
product.description || "";

document.getElementById("formTitle").textContent=
"تعديل المنتج";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* DELETE */

async function deleteProduct(id){

if(!confirm("هل تريد حذف المنتج؟")){
return;
}

try{

const response=
await fetch(
"/api/products?id="+encodeURIComponent(id),
{
method:"DELETE"
}
);

const result=
await response.json();

if(!response.ok){
throw new Error(
result.error || "فشل الحذف"
);
}

loadProducts();

}catch(error){

alert("خطأ: "+error.message);

}

}


/* RESET */

function resetForm(){

document
.getElementById("productForm")
.reset();

document
.getElementById("productId")
.value="";

document
.getElementById("formTitle")
.textContent=
"إضافة منتج جديد";

}


/* SECURITY */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
