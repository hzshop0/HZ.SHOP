<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HZ.SHOP | الإدارة</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#070707;
color:#fff
}

header{
padding:25px;
text-align:center;
border-bottom:1px solid #d4af37;
background:#111
}

.logo{
font-size:30px;
font-weight:bold;
color:#d4af37;
letter-spacing:3px
}

.container{
width:min(1050px,94%);
margin:30px auto
}

.card{
background:#111;
border:1px solid #292929;
border-radius:18px;
padding:25px;
margin-bottom:25px
}

h2{
color:#d4af37;
margin-top:0
}

input,select,textarea{
width:100%;
padding:13px;
margin-top:7px;
margin-bottom:15px;
background:#080808;
color:#fff;
border:1px solid #444;
border-radius:10px;
font-size:15px
}

input[type="file"]{
padding:10px;
cursor:pointer
}

textarea{
min-height:100px;
resize:vertical
}

button{
border:0;
border-radius:10px;
padding:13px 20px;
font-weight:bold;
cursor:pointer
}

.gold{
background:#d4af37;
color:#080808
}

.dark{
background:#252525;
color:#fff
}

.red{
background:#7d2222;
color:#fff
}

.hidden{
display:none!important
}

.status{
margin-top:15px;
color:#d4af37;
font-weight:bold
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.full{
grid-column:1/-1
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:18px
}

.product{
background:#090909;
border:1px solid #292929;
border-radius:14px;
overflow:hidden
}

.product img{
width:100%;
height:210px;
object-fit:cover;
background:#181818
}

.info{
padding:15px
}

.name{
font-size:19px;
font-weight:bold;
color:#d4af37
}

.price{
font-size:20px;
margin:10px 0
}

.old-price{
text-decoration:line-through;
color:#888
}

.badge{
display:inline-block;
background:#d4af37;
color:#080808;
padding:5px 9px;
border-radius:7px;
font-size:12px;
font-weight:bold;
margin-top:5px
}

.actions{
display:flex;
gap:8px;
margin-top:15px
}

.actions button{
flex:1
}

.preview{
width:140px;
height:140px;
border-radius:12px;
border:1px solid #444;
object-fit:cover;
display:block
}

.image-previews{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
gap:10px;
margin-top:12px
}

.image-preview-item{
position:relative;
background:#080808;
border:1px solid #292929;
border-radius:12px;
padding:7px
}

.image-preview-item img{
width:100%;
height:120px;
object-fit:cover;
border-radius:8px;
display:block
}

.image-preview-label{
font-size:10px;
color:#d4af37;
text-align:center;
margin-top:6px
}

.image-preview-remove{
position:absolute;
top:5px;
left:5px;
width:28px;
height:28px;
padding:0;
border-radius:50%;
background:#7d2222;
color:#fff;
font-size:16px;
line-height:28px
}

.current-images-title{
color:#aaa;
font-size:12px;
margin-top:8px;
margin-bottom:8px
}

@media(max-width:650px){

.grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.image-previews{
grid-template-columns:repeat(2,1fr)
}

}
</style>
</head>

<body>

<header>
<div class="logo">HZ.SHOP</div>
</header>

<div class="container">

<section id="loginCard" class="card">

<h2>🔐 دخول الإدارة</h2>

<label>كلمة مرور الإدارة</label>

<input
id="password"
type="password"
placeholder="أدخل كلمة المرور"
autocomplete="current-password"
>

<button
class="gold"
type="button"
onclick="login()"
>
دخول
</button>

<div id="loginStatus" class="status"></div>

</section>


<section id="adminPanel" class="hidden">

<div class="card">

<h2 id="formTitle">إضافة منتج جديد</h2>

<form id="productForm">

<input
id="productId"
type="hidden"
>

<div class="grid">

<div>
<label>اسم المنتج</label>
<input id="name" required>
</div>


<div>
<label>القسم</label>

<select id="category" required>

<option value="">اختر القسم</option>

<option value="العطور">العطور</option>

<option value="العناية بالبشرة">
العناية بالبشرة
</option>

<option value="العناية الشخصية">
العناية الشخصية
</option>

<option value="النظافة">
النظافة
</option>

</select>
</div>


<div>
<label>السعر</label>

<input
id="price"
type="number"
step="0.01"
required
>
</div>


<div>
<label>السعر القديم</label>

<input
id="old_price"
type="number"
step="0.01"
>
</div>


<div>
<label>المخزون</label>

<input
id="stock"
type="number"
min="0"
value="0"
>
</div>


<div>
<label>الشارة</label>

<input
id="badge"
placeholder="جديد / عرض / الأكثر مبيعاً"
>
</div>


<div class="full">

<label>
صور المنتج
</label>

<input
id="imageFile"
type="file"
accept="image/*"
multiple
>

<input
id="image"
type="hidden"
>

<input
id="images"
type="hidden"
>

<div
class="current-images-title"
id="currentImagesTitle">
</div>

<div
id="imagePreview"
class="image-previews">
</div>

<div
id="imageStatus"
class="status">
</div>

</div>


<div class="full">

<label>الوصف</label>

<textarea
id="description"
></textarea>

</div>

</div>


<button
class="gold"
type="submit"
>
حفظ المنتج
</button>

<button
class="dark"
type="button"
onclick="resetForm()"
>
إلغاء
</button>

<div
id="status"
class="status"
></div>

</form>

</div>


<div class="card">

<h2>المنتجات</h2>

<div
id="products"
class="products"
>
جاري التحميل...
</div>

</div>

</section>

</div>


<script>

let products=[];

let selectedImages=[];


/* =========================
   LOGIN
========================= */

async function login(){

const password=
document.getElementById("password").value;

const status=
document.getElementById("loginStatus");

if(!password){

status.textContent=
"أدخل كلمة المرور";

return;

}

status.textContent=
"جاري تسجيل الدخول...";

try{

const response=
await fetch(
"/api/admin-login",
{
method:"POST",

credentials:"same-origin",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
password:password
})

}
);

const result=
await response.json();

if(!response.ok){

throw new Error(
result.error ||
"فشل تسجيل الدخول"
);

}

document
.getElementById("loginCard")
.classList.add("hidden");

document
.getElementById("adminPanel")
.classList.remove("hidden");

await loadProducts();

}catch(error){

status.textContent=
"خطأ: "+error.message;

}

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

const box=
document.getElementById("products");

box.innerHTML=
"جاري تحميل المنتجات...";

try{

const response=
await fetch(
"/api/products",
{
credentials:"same-origin"
}
);

if(!response.ok){

throw new Error(
"تعذر تحميل المنتجات"
);

}

products=
await response.json();

renderProducts();

}catch(error){

box.innerHTML=
"خطأ: "+
escapeHtml(error.message);

}

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

const box=
document.getElementById("products");

if(!products.length){

box.innerHTML=
"لا توجد منتجات حتى الآن.";

return;

}

box.innerHTML=
products.map(product=>{

const image=
product.image || "";

const oldPrice=
product.old_price
?
`<div class="old-price">
$${Number(product.old_price).toFixed(2)}
</div>`
:
"";

const badge=
product.badge
?
`<div class="badge">
${escapeHtml(product.badge)}
</div>`
:
"";

return `

<div class="product">

${
image
?
`<img
src="${escapeHtml(image)}"
alt="${escapeHtml(product.name || "")}"
onerror="this.style.display='none'"
>`
:
""
}

<div class="info">

<div class="name">
${escapeHtml(product.name || "")}
</div>

<div>
${escapeHtml(product.category || "")}
</div>

${oldPrice}

<div class="price">
$${Number(product.price || 0).toFixed(2)}
</div>

${badge}

<div>
المخزون:
${Number(product.stock || 0)}
</div>

<div class="actions">

<button
class="gold"
type="button"
onclick="editProduct(${Number(product.id)})"
>
تعديل
</button>

<button
class="red"
type="button"
onclick="deleteProduct(${Number(product.id)})"
>
حذف
</button>

</div>

</div>

</div>

`;

}).join("");

}


/* =========================
   SELECT MULTIPLE IMAGES
========================= */

document
.getElementById("imageFile")
.addEventListener(
"change",
function(){

const files=
Array.from(this.files || []);

const preview=
document.getElementById("imagePreview");

const status=
document.getElementById("imageStatus");

const currentTitle=
document.getElementById("currentImagesTitle");

preview.innerHTML="";
status.textContent="";
currentTitle.textContent="";

selectedImages=[];

if(!files.length){

return;

}

const invalidFile=
files.find(
file=>
!file.type.startsWith("image/")
);

if(invalidFile){

status.textContent=
"جميع الملفات يجب أن تكون صورًا";

this.value="";

return;

}

files.forEach(
(file,index)=>{

const imageObject={
file:file,
preview:null
};

selectedImages.push(
imageObject
);

const reader=
new FileReader();

reader.onload=
function(e){

imageObject.preview=
e.target.result;

renderSelectedImages();

};

reader.readAsDataURL(file);

});

status.textContent=
files.length+
(files.length===1
?
" صورة جاهزة للرفع"
:
" صور جاهزة للرفع");

});


/* =========================
   RENDER SELECTED IMAGES
========================= */

function renderSelectedImages(){

const preview=
document.getElementById("imagePreview");

preview.innerHTML="";

selectedImages.forEach(
(item,index)=>{

preview.innerHTML+=`

<div class="image-preview-item">

<img
src="${escapeHtml(item.preview || "")}"
alt="صورة ${index+1}"
>

<div class="image-preview-label">
${index===0
?
"الصورة الرئيسية"
:
"الصورة "+(index+1)}
</div>

<button
type="button"
class="image-preview-remove"
onclick="removeSelectedImage(${index})"
>
×
</button>

</div>

`;

});

}


/* =========================
   REMOVE SELECTED IMAGE
========================= */

function removeSelectedImage(index){

selectedImages.splice(
index,
1
);

renderSelectedImages();

const status=
document.getElementById("imageStatus");

if(!selectedImages.length){

status.textContent=
"لم يتم اختيار صور جديدة";

return;

}

status.textContent=
selectedImages.length+
(selectedImages.length===1
?
" صورة جاهزة للرفع"
:
" صور جاهزة للرفع");

}


/* =========================
   UPLOAD ONE IMAGE
========================= */

async function uploadImage(file){

const formData=
new FormData();

formData.append(
"image",
file
);

const response=
await fetch(
"/api/upload-image",
{
method:"POST",
credentials:"same-origin",
body:formData
}
);

const result=
await response.json();

if(!response.ok){

throw new Error(
result.error ||
"فشل رفع الصورة"
);

}

if(!result.image){

throw new Error(
"لم يتم الحصول على رابط الصورة"
);

}

return result.image;

}


/* =========================
   UPLOAD MULTIPLE IMAGES
========================= */

async function uploadImages(files){

const status=
document.getElementById("imageStatus");

const uploaded=[];

for(
let i=0;
i<files.length;
i++
){

status.textContent=
"جاري رفع الصورة "+
(i+1)+
" من "+
files.length+
"...";

const image=
await uploadImage(
files[i]
);

uploaded.push(image);

}

status.textContent=
"تم رفع "+
uploaded.length+
(files.length===1
?
" صورة بنجاح ✅"
:
" صور بنجاح ✅");

return uploaded;

}


/* =========================
   SAVE PRODUCT
========================= */

document
.getElementById("productForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const id=
document
.getElementById("productId")
.value;

const status=
document
.getElementById("status");

const imageStatus=
document
.getElementById("imageStatus");

status.textContent=
"جاري الحفظ...";

try{

let image=
document
.getElementById("image")
.value
.trim();

let images=[];

const imagesHidden=
document
.getElementById("images")
.value
.trim();

if(imagesHidden){

try{

const parsed=
JSON.parse(imagesHidden);

if(Array.isArray(parsed)){

images=
parsed
.map(x=>String(x))
.filter(Boolean);

}

}catch(error){

console.warn(
"تعذر قراءة الصور الحالية",
error
);

}

}


/*
   إذا اختار المستخدم صورًا جديدة:
   يتم رفعها كلها.
   أول صورة تصبح الصورة الرئيسية.
*/

if(selectedImages.length){

const files=
selectedImages.map(
item=>item.file
);

const uploadedImages=
await uploadImages(files);

images=
uploadedImages;

if(uploadedImages.length){

image=
uploadedImages[0];

}

document
.getElementById("image")
.value=
image;

document
.getElementById("images")
.value=
JSON.stringify(images);

}


/*
   في حال عدم اختيار صور جديدة،
   نحافظ على الصورة الحالية.
*/

if(!images.length && image){

images=[image];

}

const data={

name:
document
.getElementById("name")
.value
.trim(),

category:
document
.getElementById("category")
.value,

price:
document
.getElementById("price")
.value,

old_price:
document
.getElementById("old_price")
.value,

stock:
document
.getElementById("stock")
.value,

badge:
document
.getElementById("badge")
.value
.trim(),

image:image,

images:images,

description:
document
.getElementById("description")
.value
.trim()

};


if(id){

data.id=id;

}


const response=
await fetch(
"/api/products",
{
method:
id
?
"PUT"
:
"POST",

credentials:
"same-origin",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(data)

}
);


const result=
await response.json();


if(!response.ok){

throw new Error(
result.error ||
"حدث خطأ أثناء الحفظ"
);

}


status.textContent=
id
?
"تم تعديل المنتج ✅"
:
"تمت إضافة المنتج ✅";


await loadProducts();

resetForm();


}catch(error){

console.error(error);

status.textContent=
"خطأ: "+
error.message;

}

});


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id){

const product=
products.find(
p=>
Number(p.id)===Number(id)
);

if(!product){

return;

}


document
.getElementById("productId")
.value=
product.id;


document
.getElementById("name")
.value=
product.name || "";


document
.getElementById("category")
.value=
product.category || "";


document
.getElementById("price")
.value=
product.price ?? "";


document
.getElementById("old_price")
.value=
product.old_price ?? "";


document
.getElementById("stock")
.value=
product.stock ?? 0;


document
.getElementById("badge")
.value=
product.badge || "";


/*
   قراءة الصور المتعددة القادمة من Worker
*/

let productImages=[];

if(
Array.isArray(product.images)
){

productImages=
product.images
.map(x=>String(x))
.filter(Boolean);

}else if(
typeof product.images==="string" &&
product.images.trim()
){

try{

const parsed=
JSON.parse(product.images);

if(Array.isArray(parsed)){

productImages=
parsed
.map(x=>String(x))
.filter(Boolean);

}

}catch(error){

console.warn(
"تعذر قراءة product.images",
error
);

}

}


/*
   التوافق مع المنتج القديم
   الذي يحتوي على image فقط.
*/

if(
!productImages.length &&
product.image
){

productImages=[
String(product.image)
];

}


document
.getElementById("image")
.value=
product.image || "";


document
.getElementById("images")
.value=
JSON.stringify(productImages);


document
.getElementById("description")
.value=
product.description || "";


document
.getElementById("imageFile")
.value="";


selectedImages=[];


const preview=
document
.getElementById("imagePreview");

preview.innerHTML="";


const currentTitle=
document
.getElementById("currentImagesTitle");

currentTitle.textContent=
productImages.length
?
"الصور الحالية للمنتج:"
:
"";


if(productImages.length){

productImages.forEach(
(image,index)=>{

preview.innerHTML+=`

<div class="image-preview-item">

<img
src="${escapeHtml(image)}"
alt="صورة ${index+1}"
onerror="this.style.display='none'"
>

<div class="image-preview-label">
${index===0
?
"الصورة الرئيسية"
:
"الصورة "+(index+1)}
</div>

</div>

`;

});

}


document
.getElementById("imageStatus")
.textContent="";


document
.getElementById("formTitle")
.textContent=
"تعديل المنتج";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

if(
!confirm(
"هل تريد حذف المنتج؟"
)
){

return;

}


try{

const response=
await fetch(
"/api/products?id="+
encodeURIComponent(id),
{
method:"DELETE",
credentials:"same-origin"
}
);


const result=
await response.json();


if(!response.ok){

throw new Error(
result.error ||
"فشل الحذف"
);

}


await loadProducts();


}catch(error){

alert(
"خطأ: "+
error.message
);

}

}


/* =========================
   RESET FORM
========================= */

function resetForm(){

document
.getElementById("productForm")
.reset();


document
.getElementById("productId")
.value="";


document
.getElementById("image")
.value="";


document
.getElementById("images")
.value="";


document
.getElementById("formTitle")
.textContent=
"إضافة منتج جديد";


document
.getElementById("imagePreview")
.innerHTML="";


document
.getElementById("currentImagesTitle")
.textContent="";


document
.getElementById("imageStatus")
.textContent="";


document
.getElementById("status")
.textContent="";


selectedImages=[];

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
