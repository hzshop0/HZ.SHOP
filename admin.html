<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HZ.SHOP | لوحة التحكم</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#070707;
  color:#fff;
}

header{
  padding:25px 20px;
  text-align:center;
  background:linear-gradient(135deg,#151515,#050505);
  border-bottom:1px solid #d4af37;
}

.logo{
  color:#d4af37;
  font-size:30px;
  font-weight:bold;
  letter-spacing:3px;
}

header p{
  color:#aaa;
  margin:8px 0 0;
}

.container{
  width:min(1100px,94%);
  margin:30px auto;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

h2{
  color:#d4af37;
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.full{
  grid-column:1/-1;
}

label{
  color:#ccc;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  background:#080808;
  color:#fff;
  border:1px solid #3b3b3b;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d4af37;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 22px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

.gold{
  background:linear-gradient(135deg,#e0bd4c,#a67c00);
  color:#050505;
}

.dark{
  background:#242424;
  color:#fff;
  border:1px solid #444;
}

.red{
  background:#7d2222;
  color:#fff;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

.product{
  background:#090909;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#151515;
}

.info{
  padding:16px;
}

.name{
  color:#d4af37;
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.category{
  color:#aaa;
  font-size:14px;
}

.price{
  font-size:20px;
  margin:12px 0;
  font-weight:bold;
}

.stock{
  color:#bbb;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  flex:1;
  padding:10px;
}

#status{
  margin-top:15px;
  color:#d4af37;
  font-weight:bold;
}

.empty{
  color:#aaa;
  text-align:center;
  padding:30px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">HZ.SHOP</div>
  <p>لوحة التحكم وإدارة المنتجات</p>
</header>

<main class="container">

<section class="card">

<h2 id="formTitle">إضافة منتج جديد</h2>

<form id="productForm">

<input type="hidden" id="productId">

<div class="grid">

<div class="field">
<label>اسم المنتج</label>
<input id="name" required>
</div>

<div class="field">
<label>القسم</label>
<select id="category" required>
<option value="">اختر القسم</option>
<option value="العطور">العطور</option>
<option value="العناية بالبشرة">العناية بالبشرة</option>
<option value="العناية الشخصية">العناية الشخصية</option>
<option value="النظافة">النظافة</option>
</select>
</div>

<div class="field">
<label>السعر</label>
<input id="price" type="number" step="0.01" required>
</div>

<div class="field">
<label>السعر القديم</label>
<input id="old_price" type="number" step="0.01">
</div>

<div class="field">
<label>المخزون</label>
<input id="stock" type="number" min="0" value="0">
</div>

<div class="field">
<label>شارة المنتج</label>
<input id="badge" placeholder="جديد / عرض / الأكثر مبيعاً">
</div>

<div class="field full">
<label>رابط صورة المنتج</label>
<input id="image" placeholder="ضع رابط صورة المنتج هنا">
</div>

<div class="field full">
<label>وصف المنتج</label>
<textarea id="description"></textarea>
</div>

</div>

<div class="buttons">
<button class="gold" type="submit">حفظ المنتج</button>
<button class="dark" type="button" onclick="resetForm()">إلغاء</button>
</div>

<div id="status"></div>

</form>

</section>


<section class="card">

<h2>منتجات المتجر</h2>

<div id="products" class="products">
<div class="empty">جاري تحميل المنتجات...</div>
</div>

</section>

</main>


<script>

let products = [];


async function loadProducts(){

const box=document.getElementById("products");

try{

const response=await fetch("/api/products");

if(!response.ok){
throw new Error("تعذر تحميل المنتجات");
}

products=await response.json();

renderProducts();

}catch(error){

box.innerHTML=
`<div class="empty">حدث خطأ: ${error.message}</div>`;

}

}


function renderProducts(){

const box=document.getElementById("products");

if(!products.length){

box.innerHTML=
`<div class="empty">لا توجد منتجات حتى الآن.</div>`;

return;

}

box.innerHTML=products.map(product=>`

<div class="product">

<img
src="${escapeHtml(product.image || "")}"
alt="${escapeHtml(product.name || "")}"
onerror="this.style.display='none'"
>

<div class="info">

<div class="name">
${escapeHtml(product.name)}
</div>

<div class="category">
${escapeHtml(product.category)}
</div>

<div class="price">
$${Number(product.price || 0).toFixed(2)}
</div>

<div class="stock">
المخزون: ${Number(product.stock || 0)}
</div>

<div class="actions">

<button
class="gold"
onclick="editProduct(${product.id})">
تعديل
</button>

<button
class="red"
onclick="deleteProduct(${product.id})">
حذف
</button>

</div>

</div>

</div>

`).join("");

}


document
.getElementById("productForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const id=document.getElementById("productId").value;

const data={

name:document.getElementById("name").value,

category:document.getElementById("category").value,

price:document.getElementById("price").value,

old_price:document.getElementById("old_price").value,

stock:document.getElementById("stock").value,

badge:document.getElementById("badge").value,

image:document.getElementById("image").value,

description:document.getElementById("description").value

};

if(id){
data.id=id;
}

const status=document.getElementById("status");

status.textContent="جاري الحفظ...";

try{

const response=await fetch("/api/products",{

method:id?"PUT":"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});

const result=await response.json();

if(!response.ok){
throw new Error(result.error || "حدث خطأ");
}

status.textContent=
id
?"تم تعديل المنتج بنجاح ✅"
:"تمت إضافة المنتج بنجاح ✅";

resetForm();

await loadProducts();

}catch(error){

status.textContent="خطأ: "+error.message;

}

});


function editProduct(id){

const product=products.find(p=>p.id==id);

if(!product)return;

document.getElementById("productId").value=product.id;

document.getElementById("name").value=product.name||"";

document.getElementById("category").value=product.category||"";

document.getElementById("price").value=product.price||"";

document.getElementById("old_price").value=product.old_price||"";

document.getElementById("stock").value=product.stock||0;

document.getElementById("badge").value=product.badge||"";

document.getElementById("image").value=product.image||"";

document.getElementById("description").value=product.description||"";

document.getElementById("formTitle").textContent=
"تعديل المنتج";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


async function deleteProduct(id){

if(!confirm("هل أنت متأكد من حذف هذا المنتج؟")){
return;
}

try{

const response=await fetch(
"/api/products?id="+encodeURIComponent(id),
{
method:"DELETE"
}
);

const result=await response.json();

if(!response.ok){
throw new Error(result.error || "فشل الحذف");
}

await loadProducts();

}catch(error){

alert("حدث خطأ: "+error.message);

}

}


function resetForm(){

document.getElementById("productForm").reset();

document.getElementById("productId").value="";

document.getElementById("formTitle").textContent=
"إضافة منتج جديد";

}


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


loadProducts();

</script>

</body>
</html>
