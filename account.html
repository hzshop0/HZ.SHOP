<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HZ.SHOP | حسابي</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:#0b0b0d;
      color:#f5f1e8;
      font-family:Arial, sans-serif;
    }

    .account-page{
      width:100%;
      max-width:1200px;
      margin:auto;
      padding:30px 20px;
    }

    .account-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:30px;
    }

    .brand{
      font-size:28px;
      font-weight:800;
      letter-spacing:1px;
    }

    .back-btn{
      border:1px solid #b08d35;
      background:transparent;
      color:#c9a84e;
      padding:10px 18px;
      border-radius:10px;
      cursor:pointer;
    }

    .account-container{
      min-height:500px;
      border:1px solid rgba(201,168,78,.25);
      border-radius:20px;
      padding:30px;
      background:#111114;
    }

    .page-title{
      font-size:26px;
      margin-bottom:10px;
    }

    .page-description{
      color:#aaa;
      line-height:1.8;
    }

  </style>

</head>

<body>

  <main class="account-page">

    <header class="account-header">

      <div class="brand">
        HZ.SHOP
      </div>

      <button
        class="back-btn"
        onclick="window.location.href='/'"
      >
        العودة للمتجر
      </button>

    </header>


    <section class="account-container">

      <h1 class="page-title">
        حسابي
      </h1>

      <p class="page-description">
        سيتم عرض حساب العميل هنا.
      </p>

    </section>

  </main>

</body>

</html>
